ux alors vous allez me faire le plaisir de me faire une bonne insulte et de vous foutre en rogne une bonne fois pour toutes!","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre II","episode":"Les classes de Bohort"}},{"citation":"Si Monsieur et Madame préfèrent s'envoyer des fions dans l'intimité, je peux aussi me retirer.","infos":{"auteur":"Alexandre Astier","acteur":"Vanessa Guedj","personnage":"Angharad","saison":"Livre II","episode":"La Joute Ancillaire"}},{"citation":"(À Arthur)Vous me prenez vraiment pour une conne.","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre II","episode":"L'Escorte II"}},{"citation":"Ben moi, je sais pas si c'est de naissance ou quoi, mais la vue du bourgeois, ça me fait de l'aérophagie.","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chapuis","personnage":"Le Tavernier","saison":"Livre II","episode":"L'Escorte II"}},{"citation":"Mais je n'ai rien à dire moi, on a rien à dire quand on est con comme une chaise !","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre II","episode":"L'Escorte II"}},{"citation":"J'ai le droit d'être 4 jours pas chez moi, et après chez moi. Mais y a du voyage qui se prépare, et pour soigner les bêtes, y a pas que ma tante, y a moi aussi.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"O'Brother"}},{"citation":"J'te présente vos hommages au roi Arthur.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"O'Brother"}},{"citation":"Karadoc, c'est le gars brillant. Le frère, à côté, c'est sûr... C'est vraiment un gros con.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"O'Brother"}},{"citation":"Mon frère, il peut pas aller à l'école. Quand on lui explique un machin technique, il s'évanouit.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"O'Brother"}},{"citation":"Ou mettre du beurre dans le fond du plat pour pas que le gratin colle.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"O'Brother"}},{"citation":"Pour savoir s'il va y avoir du vent, il faut mettre son doigt dans le cul du coq.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"O'Brother"}},{"citation":"Y'a des méchants ?","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"O'Brother"}},{"citation":"Arthour !… Couhillère !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de paix"}},{"citation":"Interprèèète ? Interprèèète, couhillère ?","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de paix"}},{"citation":"Moi, à une époque, je voulais faire vœu de pauvreté (...) Mais avec le pognon que j'rentrais, j'arrivais pas à concilier les deux.","infos":{"auteur":"Alexandre Astier","acteur":"Alexis Hénon","personnage":"Galessin","saison":"Livre II","episode":"Les Vœux"}},{"citation":"(En parlant à Arthur d'un cadeau offert par un clan saxon) Mais c'est un petit mâle, il s'appelle ... \"Ferme ta gueule\", c'est que quand il est né il arrêtait pas de couiner...","infos":{"auteur":"Alexandre Astier","acteur":"Stéphane Margot","personnage":"Calogrenant","saison":"Livre II","episode":"Le Cadeau"}},{"citation":"On vous offre des boucs, à vous, maintenant ?","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre II","episode":"Le Cadeau"}},{"citation":"Vous vous rendez compte que vous amenez des boucs dans ma chambre ?","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre II","episode":"Le Cadeau"}},{"citation":"Bohort : […] Et c'est joli.\r\nPère Blaise : Et c'est de la merde.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Robert Lombard","personnage":"Père Blaise","saison":"Livre II","episode":"La Quinte juste"}},{"citation":"Voilà ! C'est tout ce qu'y a ! Unisson, quarte, quinte et c'est marre ! Tous les autres intervalles, c'est de la merde ! Le prochain que je chope en train de siffler un intervalle païen, je fais un rapport au pape !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Robert Lombard","personnage":"Père Blaise","saison":"Livre II","episode":"La Quinte juste"}},{"citation":"Pourquoi je peux pas avoir un chien moi ? […] Mais c'est juste pour mettre des coups de pied dedans ! […] Moi j'en ai marre de toujours donner des coups de pied aux poules !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Les chiens de guerre"}},{"citation":"Fort heureusement, je tiens à préciser que l'incident n'a fait aucune victime.","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Le Donneur"}},{"citation":"Fort heureusement, l'incident n'a fait aucune victime.","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Le Donneur"}},{"citation":"Ben Gauvain il est revenu, il s'était planté une écharde comme ça dans le doigt… N'empêche, si ça s'infecte, on peut en mourir, j'vous ferais dire.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre II","episode":"Le Guet"}},{"citation":"Ah ben j'suis mi-démon, moi, les démons c'est pas foutu pareil. D'ailleurs, dans le calendrier démonique je vais bientôt avoir sept ans. J'aurai le droit d'avoir une mogriave. […] Une mogriave ? C'est comme un petit chien, mais hyper vilain.","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre II","episode":"Merlin l'archaïque"}},{"citation":"La neige, on l'enlève, elle revient. Toujours. Encore et encore. Et nous, pauvres âmes chagrines, nous perdons notre regard dans l'horizon blanc de notre solitude.","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Les Neiges Éternelles"}},{"citation":"(à Arthur) Hé ouais ! C'est pas les idées qui vous manquent, c'est la conviction de devoir les réaliser !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"L'Alliance"}},{"citation":"Attendez, on dit chef de clan parce qu'il faut dire quelque chose, hein !\r\nMais Conran, il doit y avoir trois cahutes sur la plage, ils sont une dizaine à tout casser, et c'est tous des clodos, alors...","infos":{"auteur":"Alexandre Astier","acteur":"Stéphane Margot","personnage":"Calogrenant","saison":"Livre II","episode":"L'Alliance"}},{"citation":"Ben ils m'ont dit d'aller me faire mettre. Après, ils m'ont jeté des gadins et une marmite avec un restant de soupe de poisson.","infos":{"auteur":"Alexandre Astier","acteur":"Tony Saba","personnage":"Hervé de Rinel","saison":"Livre II","episode":"L'Alliance"}},{"citation":"Ben j'en ai marre. Ça revient à chaque fois sur le tapis ça. [Arthur: Quoi ça ?] Fédéré! D'habitude j'dis rien mais là zut! J'sais pas c'que ça veut dire. Moi j'veux bien faire des efforts pour comprendre les réunions mais faut que chacun y mette du sien aussi. Là on est partis pour une heure avec des fédérés par-ci des fédérés par-là, j'vais encore rien biter et ça me gonfle.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"L'Alliance"}},{"citation":"(En Parlant d'Hervé de Rinel) Ah mais c'est ça qui pue!","infos":{"auteur":"Alexandre Astier","acteur":"Stéphane Margot","personnage":"Calogrenant","saison":"Livre II","episode":"L'Alliance"}},{"citation":"À Kadoc ! À Kadoc !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"(à propos du père Blaise) Il ressemble à Tatan !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"Elle est où la poulette ?","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"Karadoc il s'occupe, mais c'est pas ma Tatan !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"Les pattes de canaaaaaaaaaaaaaaaaaaaaaaaaaaaaard !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"Mooordu! Mooordu! Mordu mordu mordu mordu la ligne !!!!","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"Tatan, elle fait des flans.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre II","episode":"Le Jeu du caillou"}},{"citation":"(À Arthur) Dîtes tout de suite que vous avez honte de votre éducation.","infos":{"auteur":"Alexandre Astier","acteur":"Josée Drevon","personnage":"Ygerne","saison":"Livre II","episode":"Le secret d'Arthur"}},{"citation":"Mais je ne suis pas romain, merde !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le secret d'Arthur"}},{"citation":"(Beurré) Sire, vous êtes quand même un sacré souverain. Accueillir des péquenots qui sentent la bouse, comme ça, dans votre chapeau, ben je dis château ! ","infos":{"auteur":"Alexandre Astier","acteur":"François Morel","personnage":"Belt","saison":"Livre II","episode":"Spiritueux"}},{"citation":"(Complètement ivres) (Belt : -Je lève le verre à notre souverain) Notre souverain, -rain -rain !","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre II","episode":"Spiritueux"}},{"citation":"Je vais le tuer, Sire ! Je vais tellement si tant y taper sa gueule qu'il va décéder !","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre II","episode":"Feue la Vache de Roparzh"}},{"citation":"(À Roparzh) Non mais vous allez faire chier le monde pendant combien de temps vous encore avec vos vaches pourries là, hein ?! Vous voyez pas que vous êtes pas fait pour l'agriculture ?! Hein, vous avez qu'à vous recycler dans la mendicité ! En plus, vous avez… Vous avez déjà la tenue !","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre II","episode":"Feue La Vache De Roparzh"}},{"citation":"Je lui rembourse mes genoux, et si il a filé la vérole à mes bêtes, chuis chuis un marteau moi ! Je crame tout moi ! Ma ferme, la sienne, celles des autres, le château, j'vais flamber la moitié de la Bretagne.","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre II","episode":"Feue La Vache De Roparzh"}},{"citation":"Mais je vous empêche pas de faire la guerre, mais vous la ferez guéri !","infos":{"auteur":"Lionnel Astier","acteur":"Josée Drevon","personnage":"Ygerne","saison":"Livre II","episode":"Mater Dixit"}},{"citation":"(A Lancelot) Han le lèche-pompe! On vous dérange Apollon? C'est votre casque qui vous gêne ? ","infos":{"auteur":"Alexandre Astier","acteur":"Alexis Hénon","personnage":"Galessin","saison":"Livre II","episode":"Spagenhelm"}},{"citation":"(À Arthur) Alors faites des efforts pour arrêter de vous comporter comme un connard ! Moi j'en ai plein le cul de seconder un merdeux de dix ans même pas foutu de trouver un Graal ou de faire un gamin à sa femme ! Oui alors voilà, je me suis assis sur votre trône parce que je fais la moitié de votre boulot… Et je vous emmerde !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre II","episode":"Le Rebelle"}},{"citation":"(À Arthur) Non mais je sais pas comment c'est arrivé sur le tapis… On parlait d'esclavage, je crois. Les autres disaient que vous l'aboliriez sans doute dans l'avenir ; moi j'ai dit que c'est parce que vous aviez pas le courage de l'faire maintenant ; il y en a un qui m'a dit qu'il fallait pas que je me prenne pour le roi et voilà ! (un peu gêné) Alors j'ai dit… \"Le roi je l'emmerde\"… Mais c'était dit sans méchanceté.","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre II","episode":"Le Rebelle"}},{"citation":"La colombe blanche et sèche,\r\nRetombe souvent sur sa poitrine,\r\nElle vole quand même... c'est très bien,\r\nEt finit sa course dans la prairie de notre enfance.\r\n[…]\r\nLà sire j'avoue que c'est pour que ça rime avec blanche et sèche. […]\r\nBen oui c'est une rime triple : Blanche et sèche, poitrine et prairie de notre enfance. ","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre II","episode":"Les félicitations"}},{"citation":"(À Arthur) C'est l'anniversaire dans tous les recoins, c'est presque tous les ans qu'on a l'anniversaire. Grâce à cet anni... c'est la joie c'est pratique, c'est au moins un principe à retenir pour faire la frite... c'est huuuum lalalalala. Cette année c'est bien, l'anniversaire tombe à pic !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Les Félicitations"}},{"citation":"(À propos d'une ancienne vente d'esclave) Attendez, ça on en a déjà parlé ! Celui de l'autre fois, il m'avait pas dit qu'il était unijambiste.","infos":{"auteur":"Alexandre Astier","acteur":"Loïc Varraut","personnage":"Venec","saison":"Livre II","episode":"Les esclaves"}},{"citation":"En garde, ma biquette ! Je vais vous découper le gras du cul, ça vous fera ça de moins à trimbaler !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre II","episode":"Excalibur et le Destin"}},{"citation":"J'estime ne pas avoir à subir les fantasmes carriéristes d'une entité générationnelle réactionnaire et oppressive !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre II","episode":"Le Pédagogue"}},{"citation":"Si je fais mon tour pas dans le même sens que vous, ça annule. Mais si je le fais dans le même sens que vous, ça le double !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre II","episode":"Trois Cent Soixante Degrés"}},{"citation":"(À Arthur)Mouais. Méfiez-vous des cons. Y en a qui vont beaucoup plus loin qu'on ne pense !","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre II","episode":"Excalibur et le Destin "}},{"citation":"Mais vous êtes pas mort, espèce de connard ?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Always"}},{"citation":"Oubliez ce que je viens de dire. Le Graal, c'est de la merde.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Always"}},{"citation":"Le seigneur Perceval ne se met jamais en situation dangereuse. Pour ça, il fait preuve d'une intelligence redoutable.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Always "}},{"citation":"Avec un pif pareil ils feraient mieux de chercher des truffes plutôt que de nous emmerder !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Amen"}},{"citation":"(A Guethenoc) Fleur, unique, belle, vite ! J'ai besoin d'exprimer mon transport. (Guethenoc répond : Pour le transport, vaut mieux la brouette !)","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Arthur in love"}},{"citation":"JE NE MANGE PAS DE GRAINES !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre II","episode":"Corpore sano"}},{"citation":"J'estime que si on avale l'équivalent de son poids en viande deux fois par jour, il ne faut pas s'étonner de ne pas pouvoir mettre un pied devant l'autre sur un champ de bataille.","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre II","episode":"Corpore sano"}},{"citation":"Qu'est-ce que c'est que ce style de bouffer des petits machins tout secs et trois gallons de flotte par jour ? […] Si la jeunesse se met à croire à ces conneries, on se dirige tout droit vers une génération de dépressifs ! Le gras, c'est la vie.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"Corpore sano"}},{"citation":"Dans la vie, j'avais deux ennemis : le vocabulaire et les épinards. Maintenant j'ai la botte secrète et je bouffe plus d'épinards. Merci, de rien, au revoir messieurs-dames.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"La Botte secrète II"}},{"citation":"Eh oui mémé, t'es bien mouchée!","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"L'absent"}},{"citation":"Et toc ! Remonte ton slibard, Lothard !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"L'Absent"}},{"citation":"[La politique de l'autruche, c'est] Une politique qui court vite, une politique qui fait des gros œufs, c'est tout.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"La Cassette"}},{"citation":"Est-ce que vous avez conscience que j'ai de menues responsabilités au sein de ce gouvernement qui me tiennent relativement éloigné des problèmes de répartition des piaules ?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"La chambre"}},{"citation":"Et alors vous allez me libérer les locaux avant ce soir vous entendez, j'veux les turnes impeccables, les draps en tas dans le couloir et les clefs sur la porte, vous retournez crécher dans vos pays de débiles et vous foutez le camp de ma salle de bain !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"La chambre"}},{"citation":"Ah, le printemps ! La nature se réveille, les oiseaux reviennent, on crame des mecs.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"La Fête du Printemps"}},{"citation":"Le plus intéressant, c'est, comment vous arrivez à faire un truc aussi immonde avec des ingrédients normaux ? [...] Mais c'est incroyable, j'ai l'impression de bouffer de la terre avec de la bouse et du gravier, ça sent le poulailler, mais c'est du céleri et des oignons, c'est prodigieux.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"La Fête du Printemps"}},{"citation":"Ça y est… je vois trouble. C'est le manque de gras, je me dessèche.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"La Restriction"}},{"citation":"Sire ! Enfin vous arrivez pour me sauver. […] De l'hypolipémie ! J'ai plus de gras dans le sang. Je vais me mettre à peler et à perdre mes cheveux…","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"La Restriction"}},{"citation":"(À Arthur)\r\nMoi au moins quand je parlemente, c'est pas vicelard.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"La Révolte"}},{"citation":"Personnellement, la condition paysanne, j'me la taille en biseau, voyez.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"La Révolte"}},{"citation":"En tout cas, on a cramé leur tueur, s'ils veulent le récupérer, il est facile à transporter.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le complot"}},{"citation":"Vous savez c'que c'est, mon problème ? Trop gentil.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le complot"}},{"citation":"Arthour !… Pas changer assiette pour fromage !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de Paix"}},{"citation":"Couhillère, couhillère, couhillère ! Ave Cesar ! (lache une caisse)","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de Paix"}},{"citation":"Décarre tes troupes de chez moi ou j'crame ton pays. C'est assez simple comme vocabulaire ?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Dialogue de Paix"}},{"citation":"La fleur en bouquet fane, et jamais ne renaît !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de Paix"}},{"citation":"MÉTÉOOOOOOOOO !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de Paix"}},{"citation":"Troupa ! Troupa ! Troupatroupatroupatroupa ! TROUPA ! HAHAHAHAHAHAHA ! Troupaskaya !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre II","episode":"Le Dialogue de Paix"}},{"citation":"(Parlant tout seul, à table, jouant avec des aliments) Sire, nous voici a l'entrée de la grotte... Pied à terre mon fidèle Lancelot, le Graal est a porté de main ! Attention sire derrière vous ! Le chevalier noir ! Euheuh hrrr... inhin Arthur ta dernière heure a sonné... Vil félon, ou as tu dissimulé le Graal sacré ? Dans ton cul ! Tu paieras pour cet affront ! Tfftftfftfff brrrr... BRRR ! Aaahh... Victoire sire ! Le Graal enfin ! Il est vachement gros ! Attention il est pas du tout comme j'imaginais ! Sire écoutez, les villageois, ils vous acclament comme des villageois ! Vive Arthur, vive le roi de Bretagne, vive Arthur ! Hourraaa ! Hourraaa !\r\nAu secours, au secours, appelez Merlin ! Merlin arrive, oaaaahhh, apparition inexpliquée, boule de feu boule de feu brrf brrf pffifff. Attention l'ogre des collines bbhhheeuh, disparaissez de mes terres, périssez êtres inférieurs ! Catapuuultttttess catapuuultees catapuuullttes tirrrreeeezzz ! Pfrioou pfriouuu pfrioou pfriouuu pfrioou pfriouuu… (La servante arrive)\r\nC'est bon vous pouvez débarrasser...","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le monde d'Arthur"}},{"citation":"Attention, l'ogre des collines !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Monde d'Arthur"}},{"citation":"Non mais regardez. Maintenant que j'ai enlevé le mie de mon pain, aaah ouh, Arthur ! Le Graal tu t'en iras quérir. Mam mam mam mam, mam.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Monde d'Arthur"}},{"citation":"Vil félon, où as-tu dissimulé le Graal Sacré ?\u003cbr/>\r\nDans ton cul !\u003cbr/>\r\nTu paieras pour cet affront ! ","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Monde d'Arthur"}},{"citation":"J' dis déjà pas merci dans ma langue, alors je vais pas l'apprendre en picte.","infos":{"auteur":"Lionnel Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"L'Enlèvement de Guenièvre"}},{"citation":"C'est parce que je cherche le Graal que je suis roi. Et du coup que vous êtes reine. Si je cherchais pas le Graal, vous seriez encore en Carmélide en train de torcher le cul des vaches dans une des fermes de votre con de père !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le passage secret"}},{"citation":"C'est pas parce qu'un vieux moisi vient nous baver dans les étagères que ça vaut forcément que'que chose.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le Passage Secret"}},{"citation":"Remarquez… Bohort, éclaireur… rien que pour la curiosité…","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le Passage Secret"}},{"citation":"Au printemps, le sommeil ne cesse dès l'aurore. Partout se font ouïr les gazouillis d'oiseaux. La nuit s'achève enfin dans le souffle des eaux, qui sait combien de fleurs seront tombées encore . Ah, ben oui, c'est sûr, c'est du chinetoque (poème de [[Meng Haoran]] - VIII°s), hein, les mecs ils se râclent un peu la soupière avant de sortir n'importe quelle connerie !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Poème"}},{"citation":"Y'a trop de clampins qui se disent poètes qui sortent la licence poétique dès qu'ils pondent trois merdes que personne comprend .","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Poème"}},{"citation":"(À Perceval) Arthur, le dragon, Arthur... Y a rien qui gigote là-dedans ?","infos":{"auteur":"Fabien Rault","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Portrait"}},{"citation":"Mais qu'est-ce que vous venez me gonfler avec votre père Blaise !","infos":{"auteur":"Fabien Rault","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le Portrait"}},{"citation":"Vous, vous devriez arrêter de sourire. J'vous promets; ça devient vraiment malsain.","infos":{"auteur":"Fabien Rault","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Portrait"}},{"citation":"[A Karadoc et Perceval] : La boutique est fermée, adressez-vous à la concurrence. (Cette réplique sera reprise dans le Livre V, lorsque Merlin quitte Kaamelott)","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre II","episode":"Les Alchimistes"}},{"citation":"Quel tas de merdier... Non mais sérieusement, quel merdier ! Vous vous croyez où?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Les Alchimistes"}},{"citation":"Vous croyez vraiment que vous avez les moyens de me convoquer ? Je suis là parce que j'veux bien… Et si vous m'avez fait déplacer pour rien, je vous balance quinze jours dans une cage sans boire ni bouffer et je me démerde pour que vous chopiez le typhus. Je vous écoute. (Perceval : bon, on va faire simple.) J'vous l'conseille, oui.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Les Alchimistes"}},{"citation":"(Au maître d'armes)\u003cbr/>Vous êtes un grand malade mental !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Les Classes de Bohort"}},{"citation":"(Hurlant à plein poumons) MÉÉCRÉÉAAAAAAAAANTS !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Les Classes de Bohort"}},{"citation":"Mais je vous emmerde, mon petit pote ! Vous commandez ce que je vous dis de commander et vous la fermez bien comme il faut !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Les Classes de Bohort"}},{"citation":"(Hurlant) QUAND J'PENSE QU'J'AI R'FILE MA FILLE A UN ROMAIN ! J'SUIS À DEUX DOIGTS D'CRÂMER L'CHÂTEAU !!","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le Secret d'Arthur"}},{"citation":"Une fois j'ai craché sur les pompes de l'empereur Justinien, alors je vais pas me gratter pour l'un de ses sous-fifres !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre II","episode":"Le Secret d'Arthur"}},{"citation":"(A Arthur) Moi j'crois plutôt que la prochaine fois, vous nous enverrez bouler tout pareil, c'est pas vrai ? (...) Ha... On en a gros...","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Les Exploités"}},{"citation":"(À Arthur) Moi, j'serais vous, je vous écouterais... Non, moi, j'serais nous, je vous... Si moi, j'étais vous, je vous écouterais ! Non, elle me fait chier, cette phrase !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Les Exploités"}},{"citation":"Le Graal par ci, le Graal par là. Le Graal par ci, le Graal par là. Le Graal par ci, le Graal par là. Le Graal par ci, le Graal par là...","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"Les Exploités"}},{"citation":"Sire, Sire ! On en a gros !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Les Exploités"}},{"citation":"Vous nous utilisez bon gré malgré pour arriver sur la fin.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"Les Exploités"}},{"citation":"J'ai toujours eu du bol avec l'aléatoire, moi","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"Le Sort Perdu"}},{"citation":"Salut, Sire. Je trouve qu'il fait beau, mais encore frais, mais beau !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Les Volontaires II"}},{"citation":"J'le dis pas (en parlant de la date de son anniversaire). [...] A l'époque quand je le disais, tout le monde oubliait de me le souhaiter. Ça me faisait pleurer. Ça m'a gonflé, j'ai arrêté.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Le tourment II"}},{"citation":"Une heure avant, je me dis toujours : «Tiens, je vais déjeuner avec Perceval, ça me fait plaisir». [...] Ça vous la coupe, ça, hein ? Bon, après, une fois que j'ai bouffé avec vous, je regrette, hein, on est d'accord. Arrivé au milieu du repas, j'ai toujours envie de vous éclater le crâne avec le tranchant de la coupe, là, vous voyez, pour vous faire... fermer votre gueule une bonne fois pour toutes... mais sinon... je vous aime.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Le Tourment II"}},{"citation":"Remarquez que moi j'ai un pote poissonnier qui sait boire du lait à la paille par les trous de nez !","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre II","episode":"L'invincible"}},{"citation":"Bah ça va, je picole pas souvent !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre II","episode":"L'ivresse"}},{"citation":"Ben c'est pas pour prendre la défense de la petite mais c'est vrai qu'il tabasse le rouquin aujourd'hui.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"L'ivresse"}},{"citation":"Moi, une fois, j'étais soûl comme cochon, je me suis fait tatouer \"J'aime le raisin de table\" sur la miche droite, et ça y est toujours !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre II","episode":"L'ivresse"}},{"citation":"( parlant tout seul, ivre) On y voit comme à travers un pelle là-dedans... Hé lumières !!! Pff bande de fainéants... Ah ça, pour roupiller, vous êtes fortiche (s'esclaffe) Les chevaliers de la Table Ronde... CHEVALIERS DE MES DEUX !!! Chuis p... chuis pas roi, moi ? C'est p..., c'est pas moi le roi ?! (dégainant Excalibur) Et ça, c'est du nougat ??? Tout seul, je vais le chercher le Graal, moi, et la vie éternelle, c'est pour bibi !!! Et vous, vous irez vous gratter !!!","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"L'ivresse"}},{"citation":"Moi une fois, j'étais tellement bourré que j'avais l'impression de me faire attaquer de tous côtés, j'me défendais, j'me défendais... En fait, j'étais dans un pâturage, j'ai tué 76 chèvres !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"L'ivresse "}},{"citation":"Ooooooooh, non mais faire du labyrinthe avec un trou-de-balle pareil, faut drôlement de la vaillance, hein !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre II","episode":"L'Oubli"}},{"citation":"Bohort, je vous donne l'ordre de vous rendre immédiatement en Andalousie pour y rencontrer le chef wisigoth et lui transmettre le message de paix suivant :... «Coucou»...","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Neiges Éternelles "}},{"citation":"C'qui compte, c'est les valeurs !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Perceval et le Contre-sirop"}},{"citation":"Là, vous faites sirop de vingt-et-un et vous dites : beau sirop, mi-sirop, siroté, gagne-sirop, sirop-grelot, passe-montagne, sirop au bon goût.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Perceval et le Contre-sirop"}},{"citation":"C'est marrant les petits bouts de fromage par terre. C'est ça que vous appelez une fondue ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Séli et les Rongeurs"}},{"citation":"Après demain, à partir d'aujourd'hui ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Sept cent quarante-quatre"}},{"citation":"Des p'tits croutons tout vieux genre pour les lapins ? Ouais j'savais pas c'que c'était, dans le doute j'les ai bouffés.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"Sept cent quarante-quatre"}},{"citation":"De toutes façons, les réunions de la Table Ronde c'est deux fois par mois. Donc, si le mec il dit après-demain à partir de dans deux jours, suivant s'il le dit à la fin du mois, ça reporte.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Sept cent quarante-quatre"}},{"citation":"(En parlant des clients de la taverne) Quand même, ils sont onze. J'ai calculé sur les treize dernières années, dans les deux heures qui précèdent le coucher du soleil, vous en êtes à une moyenne de 8,422.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Sept cent quarante-quatre"}},{"citation":"Par exemple, vous prenez aujourd'hui. Vous comptez sept jours. Ça vous emmène dans une semaine. Et bien on sera exactement le même jour qu'aujourd'hui… À une vache près, hein… C'est pas une science exacte.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre II","episode":"Sept cent quarante-quatre"}},{"citation":"Je vais rentrer mes vaches, là, elles sont accessibles ou faut que je fasse monter un échafaudage ?","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre II","episode":"Silbury Hill"}},{"citation":"Quand vous voyez des gadins de 15 pieds de haut, plantés en rond, figurez-vous qu'ils ont pas poussé dans la nuit.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Silbury Hill"}},{"citation":"(À Arthur et Lancelot)Ah bah ça va, excusez moi d'avoir paniqué... Finalement c'est pas des démons. C'est juste les pires bestioles de tout l'univers. Mettons deux gardes là devant et allons boire un coup !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Stargate"}},{"citation":"(Criant) NOUS ALLONS TOUS MOURIR !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre II","episode":"Stargate"}},{"citation":"Mais qu'est-ce que que vous faites là, trou du cul ?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Stargate"}},{"citation":"LEODAGAN CONTRE-ATTAQUE !!! (il passe la balle à Léodagan)","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"The Game"}},{"citation":"13, 14, 15... Enfin tous les chiffres impairs jusqu'à 22.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Unagi II"}},{"citation":"Et si je vous dis que vous êtes deux glands, là, vous avez du péremptoire. C'est vous qui voyez.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Unagi II"}},{"citation":"Je gueule ; c'est vrai, j'suis un peu sec, tout ça, mais pour quelqu'un comme moi qui a facilement tendance à la dépression c'est très important ce que vous faites, parce que... Comment vous dire... C'est systématiquement débile mais c'est toujours inattendu. Et ça c'est très important pour la... la santé du... du cigare...","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Unagi II"}},{"citation":"J'vais vous dire : même si le pays était à feu et à sang, il serait hors de question que j'rate un truc pareil !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Unagi II"}},{"citation":"Mais ça va, maintenant, arrêtez le cirque, on va pas y passer la journée ! J'vous dis qu'il faut qu'j'aille chez Dagonet, alors j'attends qu'vous vous pétiez un bras, et j'me casse, alors magnez-vous l'tronc !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre II","episode":"Unagi II"}},{"citation":"J'voudrais pas faire ma raclette, mais la soirée s'annonce pas super.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre II","episode":"Un Roi à la Taverne II"}},{"citation":"Les villageois, je les emmerde !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre III","episode":"Le chevalier errant"}},{"citation":"Un village assailli de brigands, une femme qui se fait tabasser, une poule qui boîte, c'est pas les opprimés qui manquent ! Et là au moins, j'aurais l'impression de servir à quelque chose.","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre III","episode":"Le chevalier errant"}},{"citation":"Ou vous m'expliquez pourquoi vous rasez les murs comme un évadé de cachot, ou vous prenez ma main dans le pif ! ","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La Cassette II"}},{"citation":"Quand vous vous l'vez pour bouffer, vous me réveillez, vous bougez, vous allumez les bougies, vous toussez, bref ! Vous ignorez mon existence ! [...] Eh ben là, pas un bruit, pas un mouvement, tout dans le furtif. Vous avez glissé du pageot comme un pet sur une plaque de verglas !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La Cassette II"}},{"citation":"C'est une catastrophe !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre III","episode":"L'Aveu de Bohort"}},{"citation":"J'ai tout entendu et c'est honteux !!","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre III","episode":"Le Renfort Magique"}},{"citation":"Arthur ! Kaamelott, c'est zéro ! Des cailloux, des cailloux, des cailloux, ça m'énerve ! !","infos":{"auteur":"Alexandre Astier","acteur":"Lan Truong","personnage":"Attila","saison":"Livre III","episode":"Le Fléau de Dieu II"}},{"citation":"Balancez-leur les radasses et qu'ils s'en aillent au diable !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre III","episode":"Le Fléau de Dieu II"}},{"citation":"Cette fois-ci, on part avec les femmes ! HAHAAAHA !!!!","infos":{"auteur":"Alexandre Astier","acteur":"Lan Truong","personnage":"Attila","saison":"Livre III","episode":"Le Fléau de Dieu II"}},{"citation":"Eh bah mon vieux... Pour ça comme pour le reste, on n'est pas à la hauteur de la légende.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre III","episode":"Le Fléau de Dieu II"}},{"citation":"C'est vrai que, dans votre position, il y a plus de chance de subir un siège plutôt que d'en organiser un.","infos":{"auteur":"Alexandre Astier","acteur":"Axelle Laffont","personnage":"Séfriane d'Aquitaine","saison":"Livre III","episode":"Séfriane d'Aquitaine "}},{"citation":"Je suis assez grande pour voir que si vous achetez des troncs d'arbres à ce prix-là, vous êtes en train de vous faire enfler !","infos":{"auteur":"Alexandre Astier","acteur":"Axelle Laffont","personnage":"Séfriane d'Aquitaine","saison":"Livre III","episode":"Séfriane d'Aquitaine "}},{"citation":"Quand je vais raconter à mon oncle combien vous raquez pour vos béliers pourris, il va bien se marrer !","infos":{"auteur":"Alexandre Astier","acteur":"Axelle Laffont","personnage":"Séfriane d'Aquitaine","saison":"Livre III","episode":"Séfriane d'Aquitaine "}},{"citation":"Quoi ? Qu'est-ce qu'y a ? On cherche la marave ?","infos":{"auteur":"Alexandre Astier","acteur":"Axelle Laffont","personnage":"Séfriane d'Aquitaine","saison":"Livre III","episode":"Séfriane d'Aquitaine "}},{"citation":"Vous croyez quoi ? Que ça s'trouve dans l'cul des poules, le fric ?","infos":{"auteur":"Alexandre Astier","acteur":"Axelle Laffont","personnage":"Séfriane d'Aquitaine","saison":"Livre III","episode":"Séfriane d'Aquitaine "}},{"citation":"Le poisson qui étouffe sur la berge remue plus que celui qui est dans l'eau. C'est bien la preuve de ce que je dis : si on se débat, c'est qu'on est en train de crever.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre III","episode":"Le Déserteur"}},{"citation":"Non mais je bosse, moi, de jour. Je suis dans l'armée, je tiens pas un stand de crêpes.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre III","episode":"Le Déserteur"}},{"citation":"Arthour ! On est fort en pomme.","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre III","episode":"Le dialogue de paix II"}},{"citation":"Arthour ! Qu'est-ce à dire que ceci ? ON EST FORTS ! En pommes…","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre III","episode":"Le dialogue de paix II"}},{"citation":"Non posso volo, no tépo mayo. Un posso volo, tandolon toulo. Tamasso (pet) tanlamalasso. Tamasso (pet) les oiseaux petits (sur l'air de \"À la volette\")","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre III","episode":"Le dialogue de paix II"}},{"citation":"Au même titre que le bar est fermé, sauf si c'est un poisson, tout travail mérite salaire !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"Homme sans métier n'est plus apte à exercer une activité professionnelle !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"Prêtez l'oreille sans ristourne !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"Quand on connaît trop, on hésite et c'est un prompt renfort !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"Renommée, renommée, qui es-tu renommée ?!","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"Sire, sachez déjà que je ne suis pas homme à me méprendre sur le gaillard d'en face, mon petit doigt me dit que vous en êtes pas la moitié d'un !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"Tête bien pensante est par deux fois force de décision !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre III","episode":"Le Professionnel"}},{"citation":"(Aux jeunes chevaliers) Le Graal, c'est une vraie saloperie, méfiez-vous. Un jour c'est un vase, une semaine après une pierre incandescente. [...] Incandescente, c'est : qui peut accaparer des objets sans resurgir sur autrui.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Les Suppléants"}},{"citation":"Le caca des pigeons c'est caca, faut pas manger.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre III","episode":"Les Suppléants"}},{"citation":"(Sur l'air de Promenons-nous dans les bois)\r\nPas du tout, les lapins, les lapins, c'est gentil !\r\nLe poissooon ! Le petit poissooon !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre III","episode":"Les Suppléants"}},{"citation":"(À Roparzh) Excusez ! Y a moyen de vous entretenir deux secondes ? [Roparzh : Oui, c'est au sujet de quoi-t'est-ce ?] C'est au sujet que ce matin je suis passé par hasard devant vos enclos, et j'ai vu que vous aviez une jolie p'tite poule blanche ! [Roparzh : Oui, tout à fait !] Une jolie petite poule 'voyez, le bel animal […] C'est au sujet qu'en fait c'est la mienne, et que vous allez prendre un pain dans la tête, mais quelque chose de violent ! ","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre III","episode":"Feue La Poule de Guethenoc"}},{"citation":"(À Roparzh) Messieurs dames, dans quelques instants le grand spectacle de la souffrance. Si vous pouvez tâcher moyen de vous éloigner de 25 pieds, bons pieds, hein parce que ça va gicler un peu. !","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre III","episode":"Feue La Poule de Guethenoc"}},{"citation":"(À Roparzh) Vous avez tué ma poule ?! Non mais est-ce que vous êtes pas un peu marteau, vous ? Parce que moi ça y est, j'ai les nerfs qui commencent à vriller ! Je vous montre : moi je bondis comme ça, et je vous arrive dessus en piqué diagonal. Et là c'est l'hymne à la cruauté, hein, un autel dressé au culte de la barbarie !","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre III","episode":"Feue La Poule de Guethenoc"}},{"citation":"(À Guethenoc) Je dirais également que le genou peut partir dans les noix de manière assez soudaine et que ça pourrait éventuellement vous faire sortir les baloches par les oreilles. N'y voyez aucune malice !","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre III","episode":"Feue La Poule De Guethenoc"}},{"citation":"Mais tout à fait ! En parlant de... d'antidote hein, je souhaiterais vous suggérer un endroit ou vous pourriez éventuellement vous le carrer... en vous remerciant !","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre III","episode":"Feue La Poule De Guethenoc"}},{"citation":"Je suis un misérable !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre III","episode":"Arthur sensei"}},{"citation":"Ils ont rien ramené parce que c'est des débiles. Arrêtez d'envoyer Perceval et Karadoc en mission, c'est ridicule !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre III","episode":"Mission"}},{"citation":"C'est vexant de me ressembler ? C'est pour ça qu'on vous a choisi et qu'on vous a sorti de votre cambrousse, alors du respect ! ","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre III","episode":"Les Cheveux Noirs"}},{"citation":"Parce que j'ai le même type que les Jumelles maintenant ? ","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre III","episode":"Les Cheveux Noirs"}},{"citation":"Votre père, il a les cheveux noirs. Alors on continue de traiter tout le monde de bâtard ou on se calme ? ","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre III","episode":"Les Cheveux Noirs"}},{"citation":"(À Bohort) Ben voyons, mon colon !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"Au bonheur des Dames"}},{"citation":"(À Guenièvre) Bohort il a une femme ! Vous pouvez me la refaire sans trembler des genoux celle-là ?","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"Au bonheur des Dames"}},{"citation":"(À Léodagan) PIGNOUUUUF! (Puis à Elias et Merlin) Bon, et nous alors, qu'est-ce qu'on fait ? On traite ou on se fâche ? [Merlin : On se fâche. - Elias (à Merlin) : On traite !]","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La Potion de Fécondité II"}},{"citation":"(À Merlin) Le jour où vous serez à même de comprendre les rouages d'une monarchie, on aura soin de venir vous demander votre avis. En attendant, vous faites ce qu'on vous dit, ET VOUS LA BOUCLEZ !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La Potion de Fécondité II"}},{"citation":"(À Merlin) Soit vous fabriquez séance tenante une potion de fécondité qui fonctionne mieux que vos flacons de pisse habituels, soit mon mari ici présent se fera un plaisir d'outrepasser la hiérarchie et de vous mettre une trempe maison !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La Potion de Fécondité II"}},{"citation":"(À Séli, à propos de Merlin)Quoi, j'y vais ? Je l'avoine ?","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre III","episode":"La Potion de Fécondité II"}},{"citation":"Y'a toujours au moins deux solutions à un problème.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre III","episode":"La Potion de Fécondité II"}},{"citation":"(À Arthur, Léodagan et au Père Blaise) Je vais vous la faire à la cantonade dans le genre tragédie grecque, tâchez de vous partager ça au mieux : LA BOUFFE EST INTERDITE EN DEHORS DES HEURES DES REPAS !!!","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La restriction II"}},{"citation":"Alors, le ratichon ! On a un p'tit creux ?","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La restriction II"}},{"citation":"(Au Père Blaise) Jouez pas au con ! Dans votre branche, on fait pas vœu de bouffer léger, quelque chose comme ça ?","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La restriction II"}},{"citation":"Des fuites ? Apprenez qu'avec le budget bouffe de Kaamelott, y'a de quoi lever une armée parallèle et envahir la moitié du monde connu.","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La restriction II"}},{"citation":"Les placards sont fermés ! Vous allez retourner dans votre canfouine, au trot, et si la faim persiste, mangez des moustiques : c'est nourrissant, ça coûte rien, et ça débarrasse !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre III","episode":"La restriction II"}},{"citation":"Des fois on n'a pas le choix faut sacrifier des jeunes, c'est le grand qu'a dit.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre III","episode":"Witness"}},{"citation":"Qu'est-ce que vous voulez-vous insinuyer Sire ?","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre III","episode":"Saponides et detergents"}},{"citation":"Ces bourgeois, ils savent plus quoi inventer ! A force de lire et d'écrire, ils deviennent tous plus cons les uns qu'les autres.","infos":{"auteur":"Alexandre Astier","acteur":"Serge Papagalli","personnage":"Guethenoc","saison":"Livre III","episode":"Saponides et Détergents"}},{"citation":"[Arthur: Pour faire simple: on peut douter de tout sauf de la nécessité de se trouver du côté des opprimés]\r\nAh bon! C'est marrant parce que mon père, il a une phrase presque pareil: \"On peut douter de tout sauf de la nécessité de se trouver du côté de celui qui a le pognon\".","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre III","episode":"La Chevalerie"}},{"citation":"(Gauvain: Excusez nous mon oncle, notre vocabulaire n'est pas tres fourni) Ouais bah vous encore ça va, moi, même le mot vocabulaire je suis pas sûr à 100% !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre III","episode":"La Chevalerie"}},{"citation":"La chevalerie, c'est pas là où on range les chevaux ?","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre III","episode":"La Chevalerie"}},{"citation":"Noblesse bien remisée ne trouve jamais l'hiver à sa porte... Non, porte close...","infos":{"auteur":"Alexandre Astier","acteur":"Aurélien Portehaut","personnage":"Gauvain","saison":"Livre III","episode":"La Chevalerie"}},{"citation":"(À propos d'une catapulte) Est-ce qu'on peut s'en servir pour donner de l'élan à un pigeon ?","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre III","episode":"L'étudiant"}},{"citation":"(À Grüdü) Quand on est idiot, on plante des carottes on ne s'occupe pas de sécurité !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre III","episode":"L'assemblée des Rois 2e partie"}},{"citation":"J'ai pénétré leur lieu d'habitation de façon subrogative […] en tapinant.","infos":{"auteur":"Alexandre Astier","acteur":"Tony Saba","personnage":"Hervé de Rinel","saison":"Livre III","episode":"L'Espion"}},{"citation":"En voilà une bonne chose, faisons la liste des cons, et puis ça me donnera l'occasion de gratter du papier.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Robert Lombard","personnage":"Père Blaise","saison":"Livre III","episode":"Le Médiateur"}},{"citation":"Vous n'êtes pas le plus fort, Môssieur Élias ! Quand on confond un clafoutis et une part de clafoutis, on vient pas la ramener !","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre III","episode":"Les Défis De Merlin II"}},{"citation":"(À Bohort qui vient de lui déclarer que Lancelot est amoureux d'elle)Mais qu'est-ce que vous déconnez, Seigneur Bohort ? Vous avez picolé ?","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre III","episode":"Hollow Man"}},{"citation":"J'ai dit \"elle aussi\" ? […] Oh, ça m'étonne, ça... Vous êtes sûr que j'ai pas dit \"elle est sympa\" ?","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre III","episode":"Hollow Man"}},{"citation":"En même temps, admettez que me tuer n'aurait pas beaucoup de sens ! Vos nerfs seraient soulagés dans un premier temps, je ne dis pas, mais si vous considérez la situation avec un minimum de recul, vous vous apercevrez que le transport de votre hargne sur ma personne n'est pas départi d'une certaine forme d'absurdité. Et c'est là que j'ai envie de dire : est-ce que ça vaut bien le coup ?","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre III","episode":"La Dispute I"}},{"citation":"Qu'est-ce que vous voulez que je développe ? Vous n'êtes pas de taille à mener la quête du Graal, vous n'avez pas les épaules. De plus comme vous êtes incapable de vous séparer de la bande de pantins ridicules qui vous sert de gouvernement, vous passez pour un faible et un laxiste aux yeux du peuple et des pays voisins, et puis je parle pas des dieux évidemment, ceux-là, s'ils pouvaient parler... […] Et même tout nu et sur un pied, j'irai toujours cent fois plus loin que vous et votre risible compagnie de crétins !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre III","episode":"La Dispute"}},{"citation":"Vous savez que j'occupe à mi-temps ma place à la Table Ronde, et que l'autre moitié de mon temps je reprends ma place de chevalier errant... Eh bien tout ça, c'est fini. [ARTHUR : C'est-à-dire, vous revenez définitivement ?] Non, je 'pars' définitivement.","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre III","episode":"La Dispute"}},{"citation":"Eh bien puisque c'est ça, allez-y : détruisez tout ! Entretuez-vous ! Mettez la Bretagne à feu et à sang ! Et ne comptez plus sur moi pour vous amener mes gâteaux à la purée de pomme dont vous êtes si friand ! Dorénavant, vous devrez vous les cuisiner vous-même ! ENTRE DEUX MISES À SAC !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre III","episode":"La Dispute II"}},{"citation":"(À Perceval) Est-ce que vous avez souvenir qu'il se soit passé quelque chose entre Mevanwi et moi ?\r\nPerceval : À quel niveau ?\r\nAu niveau... du chou rouge.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Ablutions"}},{"citation":"(À la Dame du Lac, que tout le monde peut voir, sauf Arthur) Nooon, mais c'est bon, ne me prenez pas pour une bille, non plus ! Vous êtes la Dame du Lac.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre III","episode":"Aux Yeux de Tous II"}},{"citation":"[En parlant de la Dame du Lac que, pour une fois, tout le monde, sauf Arthur, peut voir] Ouh làlà! elle va pas me gonfler longtemps, la rouquine !!!","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Aux Yeux De Tous II"}},{"citation":"C'est moi qui remporte le tour. Quand on remporte le tour à Sloubi, on a quatorze solutions possibles : soit on annule le tour ; soit on passe ; soit on change de sens ; soit on recalcule les points ; soit on compte ; soit on divise par six ; soit on jette les bouts de bois de quinze pouces, ça c'est quand on joue avec les bouts de bois ; soit on se couche ; soit on joue sans atouts. Et après y'a les appels : plus un ; plus deux ; attrape oiseaux ; régoudon ; ou chante Sloubi. [...] Comme vous êtes second, vous avez plus que dix-neuf solutions possibles : soit vous passez ; soit vous sciez en deux les cinquante poutrelles de trente pieds, mais ça c'est quand on joue avec les bouts de bois. Sinon c'est les relances : doublette ; jeu carré ; jeu de piste ; jeu gagnant ; jeu moulin ; jeu-jeu ; joue-jeu ; joue-joue ; joue-jié ; joue-ganou ; gagnar ; catakt ; tacat ; cacatac ; cagat-cata et ratacat-mic. Ou : chante Sloubi. Nous, on va faire que chante Sloubi.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Chante Sloubi"}},{"citation":"Est-ce que vous avez assez de dés pour remplir un seau comme ça ? [Le tavernier n'en a que trois] C'est plus facile d'en tirer cent ou deux-cents d'un coup et d'additionner, parce que là avec trois, on va être obligés de tirer quarante fois de suite à chaque tour.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Chante Sloubi"}},{"citation":"Sloubi 1, sloubi 2, sloubi 3, sloubi 4, sloubi 5 [...] sloubi 324, sloubi 325!...","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Chante Sloubi"}},{"citation":"Parce que d'un point de vue santé publique, il vaut mieux bouffer ça une fois par mois que de la merde tous les jours. Je vais vous dire, à ce niveau là, c'est plus de la gastronomie, c'est de l'érotisme.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"Cuisine et Dépendances"}},{"citation":"Cette histoire de Graal, ça a assez traîné ! […] Si c'est pas moi qui prend les choses en main, on y est encore dans cent piges… […] Préparez la fiesta, j'suis un héros !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"La Corne d'abondance"}},{"citation":"Oh le con! Mais il est pas fini d'affiner! ","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"La Grande Bataille"}},{"citation":"On tombe sur le fric, comme ça, du premier coup ! On s'est même pas fait un cor au pied !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"La menace fantôme"}},{"citation":"SI VOUS VOULEZ QU'ON SORTE LES PIEDS DEVANT, FAUDRA NOUS PASSER SUR L'COOOORPS !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"La menace fantôme"}},{"citation":"Le Graal, je sais pas où il est mais il va y rester un moment, c'est moi qui vous l'dis !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"La mission"}},{"citation":"Les 3 actes, c'est les bonnes femmes qui sont mi-taupes mi-déesses, et qui ont forcé les mecs de Bethléem à construire les pyramides.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"La poétique, 1{{exp|ère}}partie"}},{"citation":"Quand on file une histoire à un copiste, pour qu'il en fasse 3 exemplaires, qu'ça va lui prendre trois mois,et qu'ça va coûter la peau des fesses, c'est pas pour raconter le temps qu'il fait ou ce que vous avez bouffé le midi, hein, il faut qu'ça pète !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"La poétique - IIème partie "}},{"citation":"Moi, je dis que c'est magique à cause des merdes qui pendouillent, mais ça se trouve, c'est pas ça ...","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre III","episode":"L'arche de transport"}},{"citation":"Ave Cesar, rosae rosam, et spiritus rex ! Ah non, parce que là, j'en ai marre !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre III","episode":"L'Assemblée des rois 2eme partie"}},{"citation":"Je ne reviendrai plus jamais, cette fois je le dis, je le fais, je reste chez moi. Merde. Ça suffit. ","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre III","episode":"L'Assemblée des rois 2eme partie"}},{"citation":"Les mômes maintenant, ils lisent, ils lisent, ils lisent et résultat...ils sont encore puceaux à 10 ans...","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre III","episode":"L'Assemblée des rois 2eme partie"}},{"citation":"Moi, j'ai appris à lire, et ben je souhaite ça à personne !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre III","episode":"L'Assemblée des rois 2eme partie"}},{"citation":"Tempora mori, tempora mundis recorda. Voilà. Eh bien ça, par exemple, ça veut absolument rien dire, mais l'effet reste le même, et pourtant j'ai jamais foutu les pieds dans une salle de classe attention !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre III","episode":"L'Assemblée des rois 2eme partie"}},{"citation":"(À Dame Ygerne, qui lui raconte son cauchemar)Ah, ça y est, il arrive le pipi !","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre III","episode":"La veillée"}},{"citation":"(À Dame Ygerne, qui lui raconte son cauchemar)Ça vous ennuie, si j'me taille les veines?","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre III","episode":"La veillée"}},{"citation":"(À Dame Ygerne, qui veut lui raconter son cauchemar)Oh je vous en prie, faites, ça fait tellement longtemps que je ne me suis pas évanouie dans mes urines...","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre III","episode":"La veillée"}},{"citation":"Vous savez, euh si on fait fouetter les ouvriers et qu'on menace de les brûler vifs, ils peuvent peut-être finir tout à l'heure, hein... (regard désespéré à Arthur) Non ? Oh bon, bah... je vais... pleurer un petit peu... (sanglots)... Excusez-moi.","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre III","episode":"La veillée"}},{"citation":"La religion c'est le bordel, admettez-le ! Alors laissez-moi prier c'que j'veux tranquille. 'M'empêche pas d'la chercher, votre saloperie de Graal.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Le Culte Secret"}},{"citation":"\r\n[Bohort: Ça dépend, Attila vous le comptez comme un Hun ?]\r\nBen évidemment, j'le compte pas comme un Ibère !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Le fléau de Dieu II"}},{"citation":"Eh bien, c'est l'histoire d'un petit ourson qui s'appelle… Arthur. Et y'a une fée, un jour, qui vient voir le petit ourson et qui lui dit : Arthur tu vas partir à la recherche du Vase Magique. Et elle lui donne une épée hmm… magique (ouais, parce qu'y a plein de trucs magiques dans l'histoire, bref) alors le petit ourson il se dit : \"Heu, chercher le Vase Magique ça doit être drôlement difficile, alors il faut que je parte dans la forêt pour trouver des amis pour m'aider.\" Alors il va voir son ami Lancelot… le cerf (parce que le cerf c'est majestueux comme ça), heu, Bohort le faisan et puis Léodagan… heu… l'ours, ouais c'est un ours aussi, c'est pas tout à fait le même ours mais bon. Donc Léodagan qui est le père de la femme du petit ourson, qui s'appelle Guenièvre la truite… non, non, parce que c'est la fille de… non c'est un ours aussi puisque c'est la fille de l'autre ours, non parce qu'après ça fait des machins mixtes, en fait un ours et une truite… non en fait ça va pas. Bref, sinon y'a Gauvain le neveu du petit ourson qui est le fils de sa sœur Anna, qui est restée à Tintagel avec sa mère Igerne la… bah non, ouais du coup je suis obligé de foutre des ours de partout sinon on pige plus rien dans la famille… Donc c'est des ours, en gros, enfin bref… Ils sont tous là et donc Petit Ourson il part avec sa troupe à la recherche du Vase Magique. Mais il le trouve pas, il le trouve pas parce qu'en fait pour la plupart d'entre eux c'est… c'est des nazes : ils sont hyper mous, ils sont bêtes, en plus y'en a qu'ont la trouille. Donc il décide de les faire bruler dans une grange pour s'en débarrasser… Donc la fée revient pour lui dire : \"Attention petit ourson, il faut être gentil avec ses amis de la forêt\" quand même c'est vrai, et du coup Petit Ourson il lui met un taquet dans la tête à la fée, comme ça : \"BAH !\". Alors la fée elle est comme ça et elle s'en va… et voilà et en fait il trouve pas le vase. En fait il est… il trouve pas… et Petit Ourson il fait de la dépression et tous les jours il se demande s'il va se tuer ou… pas…","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Legenda"}},{"citation":"Sans blague on pourrait pas fêter la mort des mecs que je connais pour une fois ? Comment ça ? C'est toujours la mort de vos potes à vous que l'on fête, moi dans quatre jours c'est l'anniversaire de la mort d'un oncle à moi, sans faire exprès il s'est tiré dessus avec un arc.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Le Jour D'Alexandre"}},{"citation":"La joie de vivre et le jambon, y'a pas trente-six recettes du bonheur !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"Le Législateur"}},{"citation":"Bon par exemple moi j'adore les fraises, bon bah si j'bouffe 3 bassines de fraises en 1 heure ah bah j'choppe la chiasse hein, j'suis comme tout l'monde hein...","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre III","episode":"Le Magnanime"}},{"citation":"Je vous ai vu une fois dans une carriole, tirée par un cheval. Enfin, la carriole tirée par un cheval.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"L'Empressée"}},{"citation":"Parce que mon couteau pour le pâté, euuh, y'a rien à faire, jm'en tape.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"Le Porte Bonheur"}},{"citation":"Dans le Languedoc, ils m'appellent Provençal. Mais c'est moi qui m'suis gouré en disant mon nom. Sinon, en Bretagne, c'est le Gros Faisan au sud, et au nord, c'est juste Ducon ..","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Le Sanglier De Cornouailles"}},{"citation":"Le Saint-Suaire ? Vous avez foutu en l'air le Saint-Suaire ?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Les clous de la sainte croix"}},{"citation":"(À Perceval) Vous racontez ce qui s'est passé, d'un coup, sans vous arrêter, et si vous changez des trucs, je vous envoie le registre à travers la gueule. Vu ?","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Robert Lombard","personnage":"Père Blaise","saison":"Livre III","episode":"Les clous de la Sainte Croix"}},{"citation":"Mais c'est pas vrai mais c'est pas vrai mais c'est pas vraiiiiiiii !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Les clous de la Sainte Croix"}},{"citation":"C'est normal, c'est en se cassant la gueule qu'on apprend à marcher. Combien de fois j'ai failli m'étouffer avec un os de lapin. Il faut jamais se laisser abattre par un échec, c'est ça le secret.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"Le Tourment III"}},{"citation":"La neige qui poudroie dans la solitude de notre enfance. Qu'est ce que vous dites de ça ? ","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre III","episode":"Le Tourment III"}},{"citation":"(A Arthur) Ça prouve que j'ai de l'ubiquité... De l'humilité ? C'est pas quand il y a des infiltrations ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"L'Etudiant"}},{"citation":"Ah, mais c'est de là que ça vient ! Quand on dit \"ça va comme sur des roulettes\". En fait ça veut dire qu'le mec il peut balancer un morceau de rocher comme une catapulte, il continue quand même d'avancer d'façon mobile. ","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"L'Etudiant"}},{"citation":"À ROULEEEEETTES !! HOULA... J'l'ai un peu trop gueulé ça, non ? À roulettes.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"L'Etudiant"}},{"citation":"Une maquette ?! Vous avez pas dit qu'c'était une catapulte ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"L'Etudiant"}},{"citation":"Non, vous, vous vous maravez. Quand on a pas de technique, il faut y aller à la zob.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Morituri"}},{"citation":"Le code c'est \"le code\" ? Ça va, ils se sont pas trop cassé le bonnet, pour l'trouver celui-là !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Poltergeist"}},{"citation":"Y'a du grabuge alors on appelle les 2 couillons... On met les glandus à profit !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre III","episode":"Poltergeist"}},{"citation":"(À Sefriane d'aquitaine) Mais votre oncle mes béliers pourris il va se les prendre dans le fion !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre III","episode":"Seriane d'aquitaine"}},{"citation":"Tout le monde le sait, en Carmélide, que vous êtes une patate. Seulement, ça passe parce que les gens savent que c'est moi qui tire les ficelles dans l'arrière boutique.","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre IV","episode":"Tous les matins du monde"}},{"citation":"Vous n'avez aucun courage. Aucune dignité. Votre manque de foi est en train de tout détruire.","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre IV","episode":"Tous Les Matins du Monde"}},{"citation":"Vous allez me lâcher les noyaux, oui ? Y'a pas assez à faire dans ce camp sans venir me les péter toutes les deux minutes ?! Faut forcément que je vous colle un ordre à chaque fois qu'il s'agit de ratisser un tas de feuilles ?! Mettez moi de l'ordre dans ce campement nom d'un chien ! Vous êtes pas à Kaamelott ici ! Je veux pas voir traîner un quignon d'pain c'est compris ?! Revue de détail dans un quart d'heure, allez zou !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre IV","episode":"Raisons et sentiments"}},{"citation":"Attendez, je veux être là quand vous lui mettez une chasse !","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre IV","episode":"Le privilégié\""}},{"citation":"(A Dagonnet) Oui... Ben non !","infos":{"auteur":"Alexandre Astier","acteur":"Alexis Hénon","personnage":"Galessin","saison":"Livre IV","episode":"Dagonnet et le cadastre"}},{"citation":"Et surtout : pensez POUVOIR ! ","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre IV","episode":"Les Liaisons Dangereuses"}},{"citation":"Nous, si vous réfléchissez bien, on a quatre bras. Avec les vôtres, ça fait six ! Posez tout ça sur le trône, imaginez un peu les possibilités…","infos":{"auteur":"Alexandre Astier","acteur":"Alexandra Saadoun et Magali Saadoun","personnage":"Les Jumelles du pêcheur","saison":"Livre IV","episode":"La Parade"}},{"citation":"Par exemple, je trouve que quand elle est partie du jour au lendemain sans prévenir, elle s'est conduite comme la reine des putes. ","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Pascal","personnage":"Demetra","saison":"Livre IV","episode":"La Parade"}},{"citation":"Ah bah en fait, c'est tout moisi seigneur breton. Parce qu'en plus, il faut que je nourrisse des mecs.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre IV","episode":"Seigneur Caius"}},{"citation":"- Hé les connards ! Vous pouvez faire griller un porcelet s'il vous plaît ?","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre IV","episode":"Seigneur Caius"}},{"citation":"MAIS ARRETEZ J'ARRETE PAS DE RETROUVER DES PTITES BOULETTES DE CACA PARTOUT ! Me prenez pas pour un con, sans blague, c'était une bergerie ici ?","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre IV","episode":"Seigneur Caius"}},{"citation":"Non, mais là vous auriez pu prévenir qu'il y avait un couvert de plus. Bon ça va que j'ai pas fait à manger, mais bon, c'est chaud.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre IV","episode":"Seigneur Caius"}},{"citation":"Dans ma chambre c'est le bordel, ça pue et y a des charençons.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"Seigneur Caïus"}},{"citation":"(À Arthur et à Mevanwi ensemble dans leur lit) Entre le calme plat du temps de Madame et la guérilla de cette nuit, je me permets de dire à Monsieur que Monsieur n'a pas bien le sens de la mesure. Monsieur est en dents de scie...","infos":{"auteur":"Alexandre Astier","acteur":"Vanessa Guedj","personnage":"Angharad","saison":"Livre IV","episode":"La chambre de la Reine"}},{"citation":"Selon Karadoc, un lit n'est pas un lit s'il n'y a pas de quoi manger une semaine dedans sans en sortir.","infos":{"auteur":"Alexandre Astier","acteur":"C
