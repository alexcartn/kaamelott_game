 ! Aaaaah ! Imperator ! Ah ça fait du bien crénom ! Ca me change de tous ces glands là... Votre tranquillité par-ci, votre tranquillité par-là... Ça, dis donc... Pour être tranquille, 24h sur 24 au plumard... À pioncer, à bouffer de la compote... Ça, c'est sûr que j'enchaîne pas les crises de nerf... Mais assieds-toi là ! On dirait que tu vas chanter une chanson ! Allez ! ","infos":{"auteur":"Alexandre Astier","acteur":"Pierre Mondy","personnage":"César","saison":"Livre VI","episode":"Arturi Inquisitio"}},{"citation":"Si Kadoc il surveille bien, il aura des p'tits cubes de fromage.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre VI","episode":"Arturi Inquisitio"}},{"citation":"Alors, sans vouloir te commander, aurais-tu l'obligeance de bien vouloir te magner le cul.","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"(En coin, à sa mère) Pardon, mère.","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"J'espère que tu fabules, bourgeois de bon aloi ! As-tu la fabulette bien preste ?","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Méfie toi, riche homme : on ne berne pas deux fois Urgan l'homme goujon, même une fois !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"On devient pas chef parce qu'on le mérite andouille ! On devient chef par un concours de circonstances, on le mérite après ! Moi, il m'a p'têt fallu dix ans pour mériter mon grade, si pas vingt. Tous les jours, j'ai travaillé pour pas nager dans mon uniforme. Y a pas trente-six solutions. Arturus ? Hein ? Fais semblant ! Fais semblant d'être Dux. Fais semblant de mériter ton grade. Fais semblant d'être un grand chef de guerre. Si tu fais bien semblant, un jour tu verras, t'auras plus besoin !","infos":{"auteur":"Alexandre Astier","acteur":"Pierre Mondy","personnage":"César","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Patience est mère de famille !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Séchez vos larmes mon épousée, je m'occupe d'aller chercher ces petites salopes par la peau du fion !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Tu ne t'en tireras à si bon compte que s'ils font les bons amis !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Tu salues plus les généraux ? C'est pourtant largement au-dessus de ton grade merdique.","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Vous préférez \"Bohort le jeune\" ou \"Bohort l'ami du raisin\" ? Parce que j'avais réfléchi à la seconde possibilité, ça fait plus fruité !","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Vincent","personnage":"Urgan","saison":"Livre VI","episode":"Dux bellorum"}},{"citation":"Allez, y'a plein de bruit, là ! Si ça se trouve c'est bourré d'oiseaux venimeux. Y'en a des rouges, des jaunes, des re-rouges et des pourpres ! Y bouffent que des noisettes et des escalopes de veau. Et quand ils vous donnent un coup de bec vous voyez une grande lumière et ça vous donne la diarrhée !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre VI","episode":"Dux Bellorum"}},{"citation":"Ça fait une heure qu'on vous achète tout ce qui vous passe sous le nez ! Si jamais on vous attaque, les gardes peuvent même pas vous défendre parce qu'ils sont obligés de transporter vos saloperies !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre VI","episode":"Dux Bellorum"}},{"citation":"Je vais poser une question simple : et vous, vous le méritez ? Ah non mais attendez, est-ce que vous le méritez, est-ce que vous méritez votre place ?! Lurco ! Tu devais aller en Germanie... c'est ta tante qui t'a fait entrer au sénat ! Pisansius ! Pas une seule année dans la légion, pas une seule ! J'm...e demande même parfois si t'as déjà tenu une arme dans ta vie... Destisius ! C'est ton père qui a donné la moitié de ses terres pour que quelqu'un puisse prendre ta place en Afrique... C'est vrai ou c'est pas vrai ? Vous êtes tous des planqués, tous, tous, tous, tous , tous. [...] Vous allez me signer cette tablette, parce que le p'tit mérite largement son grade autant que vous vous méritez votre place au Sénat... Largement.","infos":{"auteur":"Alexandre Astier","acteur":"Patrick Chesnais","personnage":"Lucius Sillius Sallustius","saison":"Livre VI","episode":"Dux Bellorum"}},{"citation":"Nan mais je l'ai déjà impressionné, moi ! Je lui ai expliqué une nouvelle technique de combat : on se bat à moitié à mains nues, et à moitié avec du calcium. J'peux vous dire il faisait moins le malin !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre VI","episode":"Dux Bellorum"}},{"citation":"Oh allez, mon pote ! Fais un effort ! Dans dix minutes, t'es pendu et on n'en parle plus. ","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Demolon","personnage":"Spurius Cordius Frontinius","saison":"Livre VI","episode":"Dux Bellorum"}},{"citation":"Ah voilà ! Et c'est là le danger de la métaphore... si on parle avec des gros tas de bidoches, au bout de cinq minutes personne ne parle de la même chose!","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Nuptiae"}},{"citation":"(À Séli)Les coups de génies, j'ai pas besoin qu'on me les souffle.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre VI","episode":"Nuptiae"}},{"citation":"(au Maître d'Armes) J'pensais à une chose, en toute amitié, un gros pain dans votre tête, ça serait de nature à vous convenir ?","infos":{"auteur":"Alexandre Astier","acteur":"Emmanuel Meirieu","personnage":"Appius Manilius","saison":"Livre VI","episode":"Nuptiae"}},{"citation":"[Aux rois de Logres] Bon. Ca c'est bien gentil mais… À quel moment on trahit ?","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Nuptiae"}},{"citation":"(Aux rois de Logres)Moi je vous le dis, si on monte pas dans le char quand il nous passe sous le nez, on finira la route à pied.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre VI","episode":"Nuptiae"}},{"citation":"En fait, je m'en suis pris deux, mais j'ai cherché la merde.","infos":{"auteur":"Alexandre Astier","acteur":"Emmanuel Meirieu","personnage":"Appius Manilius","saison":"Livre VI","episode":"Nuptiae"}},{"citation":"Ah ouais non mais attends, c'est du joli boulot là, les p'tits sacripants... Oui, sacripants, oui. C'est un terme un peu craignos. D'ailleurs, ben voilà, même craignos, c'est craignos. Mais c'est parce que je suis choqué ! Qu'est-ce que j'entends ? Tu demandes en mariage une personne âgée ? Et la p'tite Julia alors, dans tout ça ? Ah il faut que j'm'en occupe tout seul, c'est ça ? Ah très bien... Merci les p'tits fripons... Tiens, ça aussi, c'est un peu craignos, tu vois ? Mais c'est parce que là ouuuh ! Et bravo général, beau boulot ! Ah les pots cassés, c'est Verinus qui répare les pots cassés tout simplement... Ok d'accord, très bien...","infos":{"auteur":"Alexandre Astier","acteur":"Manu Payet","personnage":"Vérinus","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"[César offre à Arthur la bague de contrôle des lames] C'est pour t'apprendre à faire confiance à la magie, parce qu'il n'y a que ça qui marche sur Terre, Arturus, la magie. Le reste, ça ne vaut pas un rond.","infos":{"auteur":"Alexandre Astier","acteur":"Pierre Mondy","personnage":"César","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"C'est tout ? Treize ans qu'ils me laissent pourrir sur pied, dans ce pays de merde ! Treize ans ! Maintenant ils m'envoient un message, il faut que je rentre chez moi !\r\n[...] Mais qu'est ce qui leur fait croire que ça existe encore chez moi ?!! Est-ce qu'un type qui a foutu le camp treize ans peut encore avoir un chez soi ? C'est complètement absurde...","infos":{"auteur":"Alexandre Astier","acteur":"Tcheky Karyo","personnage":"Manius Macrinus Firmus","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"Euh, juste une chose... Manquez encore une seule fois de respect au futur roi de Bretagne, et je vous coupe les boules ! Ca vous fera une jolie petite sacoche pour ranger vos dés à coudre.","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"Je préviens monsieur et madame que s'ils ont dans l'idée de remplacer leur hypothétique progéniture par des groupes d'amis dans le style de celui-ci, en ce qui me concerne, y a d'la démission dans l'air.","infos":{"auteur":"Alexandre Astier","acteur":"Anne Benoît","personnage":"Drusilla","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"Mais moi non plus, je suis pas le chef suprême de la première puissance mondiale ! Le chef suprême de la première puissance mondiale, c'est celui qui tire les ficelles dans l'arrière-boutique, moi je suis juste un spectacle de marionnettes. Voilà. La petite journée désarticulée de César le pantin. Et ça se passe dans le ghetto !","infos":{"auteur":"Alexandre Astier","acteur":"Pierre Mondy","personnage":"César","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"(Manilius : Et ben je suis euh...) Je suis, je suis, je suis une petite tapette, qui parle à tort et à travers, sans que personne ne lui demande son avis, alors elle ferme son bec la poupoule... Et elle laisse parler les grands garçons.","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"Mille excuses... Normalement, je devrais pas dire ça à un prêtre chrétien, mais, comme vous m'avez tout l'air d'être un gros baltringue euh, je me permets ?\r\n(Père Blaise : Mmmh ?...) Vous avez oublié les alliances.","infos":{"auteur":"Alexandre Astier","acteur":"Anne Benoît","personnage":"Drusilla","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"Moi j'ai vomi deux fois mais c'est moi qu'ai ramassé\r\n !","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"[S'adressant à Arthur.] Des chefs de guerre, il y en a de toutes sortes. Des bons, des mauvais, des pleines cagettes, il y en a. Mais une fois de temps en temps, il en sort un. Exceptionnel. Un héros. Une légende. Des chefs comme ça, il y en a presque jamais. Mais tu sais ce qu'ils ont tous en commun ? Tu sais ce que c'est, leur pouvoir secret ? Ils ne se battent que pour la dignité des faibles.","infos":{"auteur":"Alexandre Astier","acteur":"Pierre Mondy","personnage":"César","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"Si on cueille pas les cerises tant qu'elles sont sur l'arbre, on fera tintin pour le clafoutis. ","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Nuptiæ"}},{"citation":"( À Arthur et Guenièvre) Hé ! A l'origine j'étais sorti pour lâcher une caisse, mais quand on vous voit comme ça dans le clair de lune, on a pas envie de bousiller le tableau. J'vais aller loufer à l'intérieur pour emboucaner les autres fumiers. Profitez ! Le plus beau dans les histoires d'amour, c'est le début...","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Arturus rex"}},{"citation":"Ah mais foutez moi la paix ! J'ai traversé l'île en long, en large et en travers ! Pareil en Aquitaine et en Armorique ! Vous croyez que j'me souviens de tous les trous du cul à qui j'ai balancé mon laïus ?","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre VI","episode":"Arturus rex"}},{"citation":"(à Arthur) Ouais en même temps ça vous a prouvé qu'on avait pas froid au ventre !\r\n(Arthur : aux yeux!)\r\nComment ?\r\n(Arthur : Aux yeux, pas froid au ventre.)\r\n(Karadoc : Froid aux yeux ? Comment c'est possible ça ?)\r\nBen si, à la limite avec du vent… mais bon si on a froid aux yeux on les ferme. !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"Alors écoutez-moi bien les sent-la-pisse, vous êtes probablement en train d'insulter un roi désigné par les dieux, et s'il y a une chose dont il ne faut pas se foutre, c'est les dieux !","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"(À propos des biscuits de la marraine du roi d'Armorique) Ils sentent la pisse, aussi.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"(À Séli)Oui vous avez raison, soyez pas trop d'mon côté. On aurait l'air un peu couple à la con à être tout l'temps d'accord !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"(Aux rois assemblés) FUMIEEEERS !!!!","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"C'que j'vous explique depuis trois quart d'heure. J'en ai rien a foutre de devenir chevalier. Ce qui m'intéresse, si y a un nouveau Roi qui chapaute tout l'système, c'est d'être en affaires avec.\r\n(Maître d'armes : Nan mais vous avez quand même écouté notre topo sur la fédération ?)\r\nJ'vous ai pas coupés en plein milieu parce que bon... Mais effectivement ça m'concerne pas votre bordel. Qu'vous vous réunissiez pour faire des fédérations, même jouer aux cartes... c'qui compte c'est qu'ce soit moi qui vous fournisse en putes.","infos":{"auteur":"Alexandre Astier","acteur":"Loïc Varraut","personnage":"Venec","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"Deus minimi placet : seul les dieux décident.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"L'adjectif qui me correspond le mieux, c'est : le plancton.","infos":{"auteur":"Alexandre Astier","acteur":"Tony Saba","personnage":"Hervé de Rinel","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"Moi les premières années avec ma femme, je faisais ces conneries aussi. Une réunion hebdomadaire pour régler les problèmes avant qu'ils ne s'enveniment. Résultat aujourd'hui, quand elle tombe sur moi dans les couloirs de la maison, elle a des remontées gastriques, elle me trouve laid et con, et elle essaie de me tuer trois fois par semaine. Euh depuis les tables rondes, j'y crois plus beaucoup...","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"Ouais c'est bien qu'on reste un peu dehors, comme ça j'pourrais vous mettre une grosse tarte en plein air.","infos":{"auteur":"Alexandre Astier","acteur":"Emmanuel Meirieu","personnage":"Appius Manilius","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"Regardez moi la jolie petite paire de fillettes, si c'est pas fragile!","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"Vous pouvez pas vous les compter vous-même vos points ? Faut forcément qu'on vous tienne le zizi ? ","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre VI","episode":"Arturus Rex"}},{"citation":"(à Demetra)Vous savez où vous pouvez vous la mettre, votre potion ?","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"[À Galessin] Soyons futés. [...] Non... mais pas vous ! Vous, vous pouvez rester tsoin-tsoin comme d'habitude.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Allez, vous devriez mettre les bouts, les demi-sels ! C'est gentil d'être passés ! On va vous faire un p'tit sac avec des restes pour manger chez vous.","infos":{"auteur":"Alexandre Astier","acteur":"Claire Nadeau","personnage":"Cryda de Tintagel","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Ben dis donc, j'sais pas c'que c'est, \"la pire\", mes p'tits cousins, mais j'peux vous garantir que, vu d'ici, ça fout les boules, hein... Ouuuh... Non, parce que, quand il a dit euh... plusieurs options, j'ai fait toute une série de p'tits pets comme ça, pou, pou, pou...","infos":{"auteur":"Alexandre Astier","acteur":"Manu Payet","personnage":"Vérinus","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Bon bon... Moi c'que j'en dis, c'est que, si vous arrivez à contenir vos élans, et à me laisser gérer tout ça à ma sauce, on pourrait bien se retrouver à la tête du Royaume en moins de temps qu'il n'en faut pour dire putsch. Ha ha ha ! J'aime assez ce p'tit ton décalé euh...","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Désolé mais vous l'avez chié votre mariage. Ce s'rait rien si c'était pas juste la deuxième fois.","infos":{"auteur":"Alexandre Astier","acteur":"Emmanuel Meirieu","personnage":"Appius Manilius","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Il est roi d'Orcanie, le sanglier boulimique, chère madame !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"J'ai à peu près compris le principe du double jeu, mais je ne saurais dire pourquoi, j'ai l'impression que tu nous l'as mis dans l'os ? Et je pense que si tu refous les pieds à Rome, ne le prends pas mal hein... je te ferai éliminer. ","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Je vous ai passé le pouvoir, je vais pas vous le reprendre. Mais faites attention de pas devenir une tarlouse.","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"\"Mundi placet et spiritus minima\", ça n'a aucun sens mais on pourrait très bien imaginer une traduction du type : \"Le roseau plie, mais ne cède... qu'en cas de pépin\" ce qui ne veut rien dire non plus.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"[Parlant de sa femme, Anna] Bon bah moi... je la suis ! Parce que je suis... très amoureux.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Sans rire, vous foutez quoi là-dedans là ? Pourtant, vous croulez pas sous les visites diplomatiques, il me semble ? Une fois tous les dix ans, vous pouvez donner un coup de balai, non ?","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Votre salope de fille m'a renversé une pleine soupière de bouillon sur toute la zone génitale, ça m'a LITTÉRALEMENT cuit les boules ! Vous remarquerez à quel point il m'est égal de parler de mes noix à ma belle-mère, famille de tarés !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Y a un truc, quand même, qu'il faut que vous compreniez bien les gars... Si vous voulez, moi, à la base... J'suis une balance... C'est le postulat de départ, on a devant soi, une balance. Donc une personne, si vous voulez, qu'on n'a pas besoin de cogner puisque elle vient elle-même délivrer l'information, sans que vous ayez même à la demander. Parce que non, pourquoi j'vous dis ça ? Puisque... on est quand même à une heure et demie de marrons dans la gueule là... Et si j'vous dis que je ne sais rien, c'est que je pense qu'effectivement...\r\n(Procyon le frappe)\r\nPfff... je n'sais rien...","infos":{"auteur":"Alexandre Astier","acteur":"Manu Payet","personnage":"Vérinus","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"Y sont où les quignons à Kadoc ? Y sont dans la poche? Y sont bien cachés ?","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre VI","episode":"Lacrimosa"}},{"citation":"D'autant que les orchestres en Bretagne, franchement, autant se frotter les noyaux avec des orties!","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Demolon","personnage":"Spurius Cordius Frontinius","saison":"Livre VI","episode":"Lacrimosa "}},{"citation":"Oui ... et tu veux les jeter où, tes épluchures ? ... en Germanie ?\r\nBalance-moi tes saloperies, et radine sur le champs.\r\nPARCE-QUE QUAND je dis TOUT l'MONDE ... ET BEN C'EST TOUT L'MONDE !\r\n...\r\nTu es gentil.","infos":{"auteur":"Alexandre Astier","acteur":"Pascal Demolon","personnage":"Spurius Cordius Frontinius","saison":"Livre VI","episode":"Lacrimosa "}},{"citation":"(à Arthur qui vient de lui raconter longuement un rêve)\r\nC'est vraiment chouette comme rêve... Moi l'autre nuit j'ai rêvé que Karadoc avait des pinces... \r\nArthur : (confus) C'est-à-dire? \r\nComme un crabe... \r\nArthur : Ah? Et qu'est-ce qu'il faisait avec ses pinces?\r\nIl me pinçait le ménisque.\r\nArthur : (interloqué) Le ménisque?\r\nComparés aux vôtres, ils sont pourris mes rêves, ou pas?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre VI","episode":"Dies Iræ"}},{"citation":"Je suis le Roi Arthur, je ne désespère pas. Jamais je perds courage. Je suis un exemple pour les enfants.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre VI","episode":"Dies Irae"}},{"citation":"Les rêves, ça se compare pas.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre VI","episode":"Dies Irae"}},{"citation":"Qu'est-ce que c'est que quelqu'un qui souffre et qui fait couler son sang par terre pour que tout le monde soit coupable ? Tous les suicidés sont le Christ. Toutes les baignoires sont le Graal... ","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre VI","episode":"Dies Irae"}},{"citation":"[À Léodagan] Écoutez, comme ça a priori, ça m'évoque rien, mais honnêtement c'est possible. Ce serait assez le genre de la maison, en tout cas ! De l'autre côté, voyez un peu l'ironie, si j'avais pas fomenté une attaque par l'ouest, vous seriez allés vous écraser contre les Romains à l'est !\r\nOui, alors, pourquoi ? Pourquoi trahir sans arrêt les gens avec qui je collabore ? Je dirais que c'est probablement une réponse compulsive à une crainte de m'attacher. Briser une relation plutôt que la cultiver pour ne pas se retrouver démuni face au bonheur. Oui, pour répondre à votre question : j'ai peur d'aimer !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre VI","episode":"Praeceptores"}},{"citation":"(À Loth)Je veux bien passer sur vos tentatives de putsch, vos combines véreuses... En revanche, si vous ne la fermez pas tout de suite, mais, définitivement, je vous aplatis les boules avec ça.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre VI","episode":"Praeceptores"}}]}</script>

  return a;
}
function replay(node) {

  void node.offsetWidth;
  node.classList.add("enter");
}

  p.textContent = text;

function clean(c) {
  const i = (c && c.infos) || {};
  return {
    text: String((c && c.citation) || "").trim(),
    perso: String(i.personnage || "").trim(),
    acteur: String(i.acteur || "").trim(),
    livre: String(i.saison || "").trim(),
    episode: String(i.episode || "").trim(),
  };
}

function parseData(j) {
  const raw = Array.isArray(j) ? j : j && j.citation;
  const list = Array.isArray(raw) ? raw : raw ? [raw] : [];
  return list.map(clean).filter((q) => q.text && q.perso);
}

function livreRank(l) {
  if (/pilote/i.test(l)) return -1;
  const m = l.match(/Livre\s+([IVX]+)/i);
  const idx = m ? ROMAN.indexOf(m[1].toUpperCase()) : -1;
  return idx === -1 ? 99 : idx;
}

// Minuscules, sans accents, apostrophes et espaces unifiés. Garde la même longueur que l'original,
// ce qui permet de surligner les mots trouvés dans le texte d'origine.
function fold(str) {
  let out = "";
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (/\s/.test(c)) { out += " "; continue; }
    if (c === "’" || c === "‘" || c === "`") { out += "'"; continue; }
    const p = plain(c);
    out += p.length === 1 ? p : (c.toLowerCase().slice(0, 1) || c);
  }
  return out;
}

let searchIndex = [];
let searchShown = 15;
const SEARCH_STEP = 15;

function buildSearchIndex() {
  searchIndex = quotes.map((q) => ({ q, hay: fold(q.text) }));
}

function runSearch(raw) {
  const folded = fold(raw).trim();
  if (folded.length < 2) return null;
  const terms = folded.split(/\s+/);
  const phrase = terms.join(" ");
  const hits = [];
  searchIndex.forEach((e) => {
    if (terms.every((t) => e.hay.indexOf(t) !== -1)) {
      hits.push({ q: e.q, hay: e.hay, exact: terms.length > 1 && e.hay.indexOf(phrase) !== -1 });
    }
  });
  hits.sort((a, b) => (b.exact - a.exact) || (livreRank(a.q.livre) - livreRank(b.q.livre)));
  return { terms, hits };
}

const isAz = (ch) => ch >= "a" && ch <= "z";
// Positions d'un mot entier (pas au milieu d'un autre) dans un texte déjà passé par fold()
function findWord(hay, word) {
  const out = [];
  let i = hay.indexOf(word);
  while (i !== -1) {
    const end = i + word.length;
    if (!(i > 0 && isAz(hay[i - 1])) && !(end < hay.length && isAz(hay[end]))) out.push(i);
    i = hay.indexOf(word, end);
  }
  return out;
}

function markedText(text, hay, terms, whole) {
  const ranges = [];
  terms.forEach((t) => {
    if (whole) { findWord(hay, t).forEach((a) => ranges.push([a, a + t.length])); return; }
    let i = hay.indexOf(t);
    while (i !== -1) { ranges.push([i, i + t.length]); i = hay.indexOf(t, i + t.length); }
  });
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  ranges.forEach((r) => {
    const last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push(r.slice());
  });
  const frag = document.createDocumentFragment();
  let pos = 0;
  merged.forEach(([a, b]) => {
    if (a > pos) frag.appendChild(document.createTextNode(text.slice(pos, a)));
    frag.appendChild(el("mark", "", text.slice(a, b)));
    pos = b;
  });
  if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
  return frag;
}

function hitNode(h, terms) {
  const art = el("article", "hit");
  const txt = el("p", "hit-text");
  txt.appendChild(markedText(h.q.text, h.hay, h.exact ? [terms.join(" ")] : terms));
  const colo = el("p", "hit-colo");
  const copy = el("button", "linklike", "Copier");
  copy.type = "button";
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText("« " + h.q.text + " »\n" + h.q.perso + ", Kaamelott");
      copy.textContent = "Copié";
    } catch (e) {
      copy.textContent = "Copie impossible";
    }
    setTimeout(() => { copy.textContent = "Copier"; }, 1500);
  };
  colo.append(
    el("span", "who", h.q.perso + (h.q.acteur ? " · " + h.q.acteur : "")),
    el("span", "where", [h.q.livre, h.q.episode].filter(Boolean).join(" · ")),
    copy
  );
  art.append(txt, colo);
  return art;
}

/* ===== Ressenti de jeu : sons synthétisés (aucun fichier audio) =====
   Le son est désactivé par défaut ; le bouton haut-parleur de la barre de jeu l'active. */
const feel = {
  sound: store.get("kmt-sound") === "1",
  ctx: null,
  setSound(on) { this.sound = on; store.set("kmt-sound", on ? "1" : "0"); },
  tone(freq, dur, o) {
    o = o || {};
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
      }
      const ctx = this.ctx;
      if (ctx.state === "suspended") ctx.resume();
      const t0 = ctx.currentTime + (o.delay || 0);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + o.slide), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.05, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* ignoré */ }
  },
  sfx(name, arg) {
    if (!this.sound) return;
    if (name === "tap") this.tone(520, 0.04, { type: "triangle", gain: 0.03 });
    else if (name === "ok") { this.tone(660, 0.09, { type: "triangle" }); this.tone(880, 0.14, { type: "triangle", delay: 0.07 }); }
    else if (name === "miss") this.tone(200, 0.2, { type: "sawtooth", gain: 0.035, slide: -90 });
    else if (name === "flip") this.tone(arg, 0.08, { type: "triangle", gain: 0.03 });
    else if (name === "win") [523, 659, 784, 1047].forEach((f, k) => this.tone(f, 0.16, { type: "triangle", delay: k * 0.09 }));
    else if (name === "lose") [330, 262, 196].forEach((f, k) => this.tone(f, 0.22, { type: "sawtooth", gain: 0.03, delay: k * 0.14 }));
  },
};

function pickQuotes(level, n, rnd, ok, avoid) {
  const set = new Set(level.persos);
  const pool = quotes.filter((q) => set.has(q.perso) && ok(q) && !(avoid && avoid.has(q)));
  const byPerso = {};
  pool.forEach((q) => { (byPerso[q.perso] = byPerso[q.perso] || []).push(q); });
  const persos = Object.keys(byPerso).sort(cmp);
  const cap = Math.ceil(n / Math.max(persos.length, 1)) + 1;
  const used = {};
  const picked = [];

  if (level.uniform) {
    // Chaque personnage a la même chance : les seconds rôles tombent souvent.
    const left = {};
    persos.forEach((p) => { left[p] = shuffle(byPerso[p], rnd); });
    let guard = 0;
    while (picked.length < n && guard++ < 1000) {
      const open = persos.filter((p) => left[p].length && (used[p] || 0) < cap);
      if (!open.length) break;
      const p = open[Math.floor(rnd() * open.length)];
      picked.push(left[p].pop());
      used[p] = (used[p] || 0) + 1;
    }
  } else {
    for (const q of shuffle(pool, rnd)) {
      if (picked.length >= n) break;
      if ((used[q.perso] || 0) >= cap) continue;
      picked.push(q);
      used[q.perso] = (used[q.perso] || 0) + 1;
    }
  }
  return picked;
}

/* Qui a dit ça ? */
function buildQuestions(level, n, rnd, avoid) {
  return pickQuotes(level, n, rnd, (q) => q.text.length <= 220, avoid).map((q) => {
    const others = shuffle(level.persos.filter((p) => p !== q.perso), rnd).slice(0, 3);
    return { quote: q, text: q.text, answer: q.perso, options: shuffle([q.perso, ...others], rnd) };
  });
}

  quit.onclick = () => onQuit({ score });
  tally.append(num, sc, feelToggle(), quit);
  const stage = el("div");
  const feedback = el("div", "feedback");
  feedback.setAttribute("aria-live", "polite");
  const actions = el("div", "actions");
  const next = el("button", "btn primary");
  next.hidden = true;
  actions.appendChild(next);
  root.append(tally, stage, feedback, actions);

  function paintTally() {
    num.textContent = "Série : " + score;
    sc.textContent = "Record : " + (Math.max(src.best, score) || "–");
    if (lastScore >= 0 && score > lastScore) bump(num);
    lastScore = score;
  }

  function show() {
    answered = false;
    const qn = questions[i];
    next.hidden = true;
    feedback.textContent = "";
    paintTally();
    stage.innerHTML = "";

    if (qn.speaker) {
      const sp = el("p", "speaker rise", qn.speaker + " :");
      sp.style.setProperty("--i", 0);
      stage.appendChild(sp);
    }
    quoteEl = el("p", "quote rise");
    quoteEl.style.setProperty("--i", 1);
    setQuote(quoteEl, qn.text);

    const choices = el("div", "choices");
    qn.options.forEach((name, k) => {
      const b = el("button", "choice rise");
      b.style.setProperty("--i", k + 2);
      b.dataset.name = name;
      const mark = el("span", "mark");
      mark.setAttribute("aria-hidden", "true");
      b.append(el("span", "key", "abcd"[k] + "."), el("span", "name", name), mark);
      b.onclick = () => answer(b, name);
      choices.appendChild(b);
    });
    stage.append(quoteEl, choices);
    replay(stage);
  }

  function answer(btn, name) {
    if (answered) return;
    answered = true;
    const qn = questions[i];
    const good = name === qn.answer;
    if (good) score++; else lost = true;
    btn.classList.add(good ? "pop" : "nope");
    feel.sfx(good ? "ok" : "miss");

    stage.querySelectorAll(".choice").forEach((b) => {
      b.disabled = true;
      if (b.dataset.name === qn.answer) {
        b.classList.add("ok");
        b.querySelector(".mark").textContent = "✓";
      }
    });
    if (!good) {
      btn.classList.add("ko");
      btn.querySelector(".mark").textContent = "✗";
    }

    feedback.textContent = "";
    feedback.append(
      el("span", "verdict " + (good ? "ok" : "ko"), good ? "Bien vu." : "Raté."),
      document.createTextNode(" " + [qn.quote.livre, qn.quote.episode].filter(Boolean).join(" · "))
    );
    paintTally();
    next.textContent = lost ? "Voir le résultat" : "Question suivante";
    next.hidden = false;
    next.focus({ preventScroll: true });
  }

  next.onclick = () => {
    if (lost) { onFinish({ score }); return; }
    i++;
    if (i >= questions.length) {
      const more = src.more();
      if (!more.length) { onFinish({ score }); return; }
      questions.push(...more);
    }
    show();
  };
  show();
  return { destroy() {} };
}

/* Le pendu : un mot de la réplique est caché, on le devine lettre par lettre */
const HANG_RULES = {
  facile: { lives: 8, hint: true, showSpeaker: true },
  moyen: { lives: 6, hint: false, showSpeaker: true },
  difficile: { lives: 5, hint: false, showSpeaker: false },
};
const HANG_DESC = {
  facile: "8 erreurs permises, première lettre offerte",
  moyen: "6 erreurs permises, personnage affiché",
  difficile: "5 erreurs permises, personnage caché",
};
const STOPWORDS = new Set(("alors aussi avait avant avez avons ainsi apres cette comme encore entre etaient etes faire leurs " +
  "meme memes moins notre votre parce pourquoi quand quelle quelles quels sans toute toutes voila peut peux plus rien donc " +
  "ceux celle celui cela cecil chaque autre autres comment depuis alors puis mais voici etre avoir sont sera seront serait").split(" "));

function plain(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

// Tous les mots d'une réplique faits uniquement de lettres a-z (accents ignorés), avec leur position
function wordTokens(text) {
  const out = [];
  for (const m of text.matchAll(/\S+/g)) {
    const lead = m[0].match(/^[^\p{L}]*/u)[0].length;
    const core = m[0].slice(lead).replace(/[^\p{L}]+$/u, "");
    if (/^\p{L}+$/u.test(core) && /^[a-z]+$/.test(plain(core)) && plain(core).length === core.length) {
      out.push({ start: m.index + lead, end: m.index + lead + core.length, core, word: plain(core) });
    }
  }
  return out;
}

function hangTokens(text) {
  return wordTokens(text).filter((t) => t.core.length >= 5 && t.core.length <= 12 && !STOPWORDS.has(t.word));
}

function buildHangman(level, n, rnd, avoid) {
  const rule = HANG_RULES[level.id];
  const found = new Map();
  const chosen = pickQuotes(level, n, rnd, (q) => {
    if (q.text.length > 200) return false;
    const t = hangTokens(q.text);
    if (!t.length) return false;
    found.set(q, t);
    return true;
  }, avoid);
  return chosen.map((q) => {
    const toks = found.get(q);
    const target = toks[Math.floor(rnd() * toks.length)];
    return {
      quote: q,
      text: q.text,
      word: target.word,
      shown: target.core,
      gaps: toks.filter((t) => t.word === target.word),
      speaker: rule.showSpeaker ? q.perso : "",
      lives: rule.lives,
      hint: rule.hint,
    };
  });
}

/* Potence gothique : 8 étapes, du socle jusqu'aux jambes */
const GIBBET_STEPS = 8;
function buildGibbet() {
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach((k) => n.setAttribute(k, attrs[k]));
    if (parent) parent.appendChild(n);
    return n;
  };
  const svg = mk("svg", { viewBox: "0 0 140 170", role: "img", class: "gibbet" });
  const fixed = mk("g", {}, svg);
  // Le corbeau se pose sur la poutre quand la potence est achevée
  const crow = mk("g", { class: "crow" }, svg);
  mk("ellipse", { cx: 82, cy: 17, rx: 8, ry: 5 }, crow);
  mk("circle", { cx: 90, cy: 12, r: 3.6 }, crow);
  mk("path", { d: "M93 11 L99 13 L93 14.5 Z" }, crow);
  mk("path", { d: "M75 15 L64 20 L76 21 Z" }, crow);
  const hang = mk("g", { class: "hang" }, svg);
  const parts = [];
  const part = (host, draw) => {
    const g = mk("g", { class: "gpart" }, host);
    draw((tag, attrs) => mk(tag, Object.assign({ pathLength: 1 }, attrs), g));
    parts.push(g);
  };
  // 1. socle de pierre à deux gradins
  part(fixed, (add) => {
    add("rect", { x: 8, y: 158, width: 104, height: 9, class: "stone" });
    add("rect", { x: 20, y: 150, width: 80, height: 8, class: "stone" });
    add("path", { d: "M36 158 V167 M62 158 V167 M88 158 V167 M50 150 V158 M76 150 V158", class: "ink thin" });
  });
  // 2. poteau de bois, fleuron doré
  part(fixed, (add) => {
    add("rect", { x: 34, y: 22, width: 12, height: 128, class: "wood" });
    add("path", { d: "M38 30 V144 M42 36 V138", class: "grain" });
    add("rect", { x: 30, y: 144, width: 20, height: 6, class: "wood" });
    add("path", { d: "M40 3 L47 11 L40 19 L33 11 Z", class: "gilt" });
  });
  // 3. poutre, arc brisé, pointe dorée
  part(fixed, (add) => {
    add("rect", { x: 34, y: 22, width: 90, height: 10, class: "wood" });
    add("path", { d: "M38 26 H120", class: "grain" });
    add("path", { d: "M46 68 Q64 62 74 32", class: "brace" });
    add("circle", { cx: 124, cy: 27, r: 4.2, class: "gilt" });
  });
  // 4. corde et nœud coulant
  part(hang, (add) => {
    add("path", { d: "M104 32 V50", class: "rope" });
    add("path", { d: "M96 66 Q104 77 112 66", class: "rope" });
  });
  // 5. tête coiffée d'un chaperon
  part(hang, (add) => {
    add("circle", { cx: 104, cy: 58, r: 9, class: "skin" });
    add("path", { d: "M94.6 56 Q104 42 113.4 56 Q104 52 94.6 56 Z", class: "cloth" });
  });
  // 6. tunique à ceinture dorée
  part(hang, (add) => {
    add("path", { d: "M94 70 H114 L117 108 H91 Z", class: "cloth" });
    add("path", { d: "M92.4 98 H115.6", class: "belt" });
  });
  // 7. manches et mains
  part(hang, (add) => {
    add("path", { d: "M95 74 L86 100", class: "sleeve" });
    add("path", { d: "M113 74 L122 100", class: "sleeve" });
    add("circle", { cx: 85.4, cy: 104, r: 3.4, class: "skin" });
    add("circle", { cx: 122.6, cy: 104, r: 3.4, class: "skin" });
  });
  // 8. chausses, bottes et yeux clos
  part(hang, (add) => {
    add("path", { d: "M97 108 L95 135", class: "hose" });
    add("path", { d: "M111 108 L113 135", class: "hose" });
    add("ellipse", { cx: 94, cy: 139, rx: 6.5, ry: 3.4, class: "boot" });
    add("ellipse", { cx: 114, cy: 139, rx: 6.5, ry: 3.4, class: "boot" });
    add("path", { d: "M99.5 57 L102.5 60 M102.5 57 L99.5 60 M105.5 57 L108.5 60 M108.5 57 L105.5 60", class: "ink thin" });
  });
  return {
    svg,
    show(n) {
      parts.forEach((g, k) => g.classList.toggle("on", k < n));
      svg.classList.toggle("dead", n >= GIBBET_STEPS);
      svg.setAttribute("aria-label", "Potence : " + n + " trait" + (n > 1 ? "s" : "") + " sur " + GIBBET_STEPS);
    },

}

function playHangman(root, src, onFinish, onQuit) {
  const questions = src.first.slice();
  const ALPHA = "abcdefghijklmnopqrstuvwxyz".split("");
  let i = 0, score = 0, over = true, wrong = 0, lastScore = -1;
  let tried = new Set();
  let needed = new Set();
  let qn = null;
  let slotsOf = [];
  let lastHit = null;
  const keyBtns = {};

  root.innerHTML = "";
  const tally = el("div", "tally");
  const num = el("span");
  const sc = el("span");
  const quit = el("button", "back", "Arrêter");
  quit.type = "button";
  quit.onclick = () => onQuit({ score });
  tally.append(num, sc, feelToggle(), quit);

  const stage = el("div");
  const speaker = el("p", "speaker");
  const quoteEl = el("p", "quote");
  const lives = el("div", "lives");
  const gibbet = buildGibbet();
  const side = el("div", "lives-side");
  const livesLabel = el("p", "lives-label");
  const feedback = el("div", "feedback");
  feedback.setAttribute("aria-live", "polite");
  side.append(livesLabel, feedback);
  lives.append(gibbet.svg, side);
  stage.append(speaker, quoteEl, lives);

  const keys = el("div", "keys");
  keys.setAttribute("role", "group");
  keys.setAttribute("aria-label", "Lettres");
  ALPHA.forEach((c) => {
    const b = el("button", "key-btn", c);
    b.type = "button";
    b.setAttribute("aria-label", c.toUpperCase());
    b.onclick = () => guess(c);
    keyBtns[c] = b;
    keys.appendChild(b);
  });

  const actions = el("div", "actions");
  const next = el("button", "btn primary");
  next.hidden = true;
  actions.appendChild(next);
  root.append(tally, stage, keys, actions);

  function paintQuote(end) {
    // end : null en cours de partie, "won" ou "lost" une fois le mot terminé
    quoteEl.textContent = "";
    slotsOf = [];
    let pos = 0;
    let si = 0, popIdx = 0;
    qn.gaps.forEach((g) => {
      quoteEl.appendChild(document.createTextNode(qn.text.slice(pos, g.start)));
      const wrapEl = el("span", "gap");
      for (let k = 0; k < g.core.length; k++) {
        const known = tried.has(g.word[k]);
        const slot = el("span", "slot");
        if (known || end) {
          slot.textContent = g.core[k];
          if (end === "won") { slot.classList.add("won", "wave"); slot.style.setProperty("--d", si * 45 + "ms"); }
          else if (end === "lost" && !known) slot.classList.add("miss");
          else if (!end && g.word[k] === lastHit) { slot.classList.add("pop"); slot.style.setProperty("--d", popIdx++ * 70 + "ms"); }
        } else {
          slot.textContent = " ";
        }
        wrapEl.appendChild(slot);
        si++;
      }
      if (!end) {
        wrapEl.setAttribute("role", "img");
        wrapEl.setAttribute("aria-label", "mot de " + g.core.length + " lettres : " +
          g.word.split("").map((c) => (tried.has(c) ? c : "blanc")).join(", "));
      }
      quoteEl.appendChild(wrapEl);
      pos = g.end;
    });
    quoteEl.appendChild(document.createTextNode(qn.text.slice(pos)));
  }

  function paintTally() {
    num.textContent = "Série : " + score;
    sc.textContent = "Record : " + (Math.max(src.best, score) || "–");
    if (lastScore >= 0 && score > lastScore) bump(num);
    lastScore = score;
  }

  function paintGibbet() {
    const on = wrong === 0 ? 0 : Math.max(1, Math.round((wrong * GIBBET_STEPS) / qn.lives));
    gibbet.show(on);
    const left = qn.lives - wrong;
    livesLabel.textContent = left > 0
      ? "Encore " + left + (left > 1 ? " erreurs permises" : " erreur permise")
      : "Plus aucune erreur permise";
  }

  function show() {
    qn = questions[i];
    over = false;
    wrong = 0;
    tried = new Set();
    needed = new Set(qn.word.split(""));
    lastHit = null;
    if (qn.hint) tried.add(qn.word[0]);

    next.hidden = true;
    keys.hidden = false;
    feedback.textContent = "";
    paintTally();
    speaker.hidden = !qn.speaker;
    speaker.textContent = qn.speaker ? qn.speaker + " :" : "";
    ALPHA.forEach((c) => {
      const b = keyBtns[c];
      b.disabled = false;
      b.className = "key-btn";
    });
    if (qn.hint) {
      keyBtns[qn.word[0]].disabled = true;
      keyBtns[qn.word[0]].classList.add("hit");
    }
    paintQuote(null);
    paintGibbet();
    [speaker, quoteEl, lives, keys].forEach((n, k) => { n.classList.add("rise"); n.style.setProperty("--i", k); });
    replay(stage);
    replay(keys);
  }

  function guess(c) {
    if (over || tried.has(c)) return;
    tried.add(c);
    const hit = needed.has(c);
    const b = keyBtns[c];
    b.disabled = true;
    b.classList.add(hit ? "hit" : "miss", hit ? "pop" : "nope");
    lastHit = hit ? c : null;
    feel.sfx(hit ? "ok" : "miss");
    const label = c.toUpperCase();
    feedback.textContent = "";
    if (hit) {
      const n = qn.word.split("").filter((x) => x === c).length;
      feedback.appendChild(el("span", "verdict ok", n > 1 ? n + " « " + label + " »." : "Un « " + label + " »."));
    } else {
      wrong++;
      feedback.appendChild(el("span", "verdict ko", "Pas de « " + label + " »."));
      paintGibbet();
      lives.classList.remove("hit");
      void lives.offsetWidth;
      lives.classList.add("hit");
    }
    const won = [...needed].every((x) => tried.has(x));
    if (won || wrong >= qn.lives) finishWord(won);
    else paintQuote(null);
  }

  function finishWord(won) {
    over = true;
    qn.won = won;
    if (won) score++;
    feel.sfx(won ? "win" : "lose");
    paintQuote(won ? "won" : "lost");
    keys.hidden = true;
    feedback.textContent = "";
    feedback.append(
      el("span", "verdict " + (won ? "ok" : "ko"), won ? "Bien vu." : "Pendu : c'était « " + qn.shown + " »."),
      document.createTextNode(" " + [qn.quote.livre, qn.quote.episode].filter(Boolean).join(" · "))
    );
    paintTally();
    next.textContent = won ? "Mot suivant" : "Voir le résultat";
    next.hidden = false;
    next.focus({ preventScroll: true });
  }

  function onKey(e) {
    if (!stage.isConnected) return;
    if ($("view-play").hidden || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    const c = plain(e.key);
    if (/^[a-z]$/.test(c)) guess(c);
  }
  document.addEventListener("keydown", onKey);

  next.onclick = () => {
    if (over && !questions[i].won) { document.removeEventListener("keydown", onKey); onFinish({ score }); return; }
    i++;
    if (i >= questions.length) {
      const more = src.more();
      if (!more.length) { document.removeEventListener("keydown", onKey); onFinish({ score }); return; }
      questions.push(...more);
    }
    show();
  };
  show();
  return { destroy() { document.removeEventListener("keydown", onKey); } };
}

/* ===== Le mot juste : un mot à trouver en six essais ===== */
// Liste de mots français embarquée (voir tools/build-mots.js) : c = courants, r = plus rares, d = autres mots de 5 lettres.
// Sert à refuser les mots inventés et à ne garder, comme réponses, que des mots naturels.
let dico = null;
async function loadDico() {
  try {
    const bin = Uint8Array.from(atob($("mots").textContent.trim()), (ch) => ch.charCodeAt(0));
    const text = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    const j = JSON.parse(text);
    const set = (str) => new Set(str.split(" ").filter(Boolean));
    dico = { c: set(j.c), r: set(j.r), d: set(j.d) };
    wordBank = null;
  } catch (e) {
    dico = null; // navigateur trop ancien : on n'impose pas de validation
  }
}

// Un mot dit dans la série est toujours accepté, même s'il n'est pas dans la liste (argot, noms)
function isValidGuess(w) {
  if (!dico) return true;
  if (!wordBank) wordBank = buildWordBank();
  return dico.c.has(w) || dico.r.has(w) || dico.d.has(w) || wordBank.valid.has(w);
}

// Jamais en réponse : insultes, et formes conjuguées ("prenez", "voulaient") qui ne font pas un bon mot à deviner
const WORD_BLOCK = new Set("salope pute putain enculer encule connasse connard tapette pd debiles debile".split(" "));
const CONJ_END = /(ez|ons|ais|ait|aient|ant|ions|iez|erais|erait)$/;
const okAnswer = (e) => !STOPWORDS.has(e.word) && !WORD_BLOCK.has(e.word);

const WORD_RULES = {
  facile: (e) => okAnswer(e) && e.word.length === 5 && e.count >= 2 && (!dico || dico.c.has(e.word) || e.count >= 8),
  moyen: (e) => okAnswer(e) && (e.word.length === 6 || e.word.length === 7) && e.count >= 2 && (!dico || dico.c.has(e.word) || dico.r.has(e.word) || e.count >= 8),
  // Roi : les mots typés série, fréquents dans les répliques mais pas dans le français de tous les jours (graal, seigneur, bretagne…)
  difficile: (e) => okAnswer(e) && e.word.length >= 5 && e.word.length <= 9 && e.count >= 3 && !CONJ_END.test(e.word) && (!dico || (!dico.c.has(e.word) && !dico.r.has(e.word))),
};
const WORD_DESC = {
  facile: "Mots courants de 5 lettres, réplique et personnage visibles",
  moyen: "Mots de 6 ou 7 lettres, réplique visible, personnage caché",
  difficile: "Noms de personnages et mots de la série, sans la réplique",
};
let wordBank = null;

function buildWordBank() {
  const map = new Map();
  quotes.forEach((q) => {
    const seen = new Set();
    wordTokens(q.text).forEach((t) => {
      let e = map.get(t.word);
      if (!e) { e = { word: t.word, count: 0, forms: {}, quotes: [] }; map.set(t.word, e); }
      const f = t.core.toLowerCase();
      e.forms[f] = (e.forms[f] || 0) + 1;
      if (!seen.has(t.word)) { seen.add(t.word); e.count++; e.quotes.push(q); }
    });
  });
  map.forEach((e) => { e.shown = Object.keys(e.forms).sort((a, b) => e.forms[b] - e.forms[a])[0]; });
  const names = new Map();
  quotes.forEach((q) => {
    if (!/^\p{L}+$/u.test(q.perso)) return;
    const w = fold(q.perso);
    if (!/^[a-z]{4,10}$/.test(w) || w.length !== q.perso.length) return;
    if (!names.has(w)) names.set(w, { word: w, shown: q.perso, quotes: [], isName: true });
    names.get(w).quotes.push(q);
  });
  const valid = new Set([...map.keys(), ...names.keys()]);
  return { words: [...map.values()], names: [...names.values()], valid };
}

function buildWordle(level, n, rnd, avoid) {
  if (!wordBank) wordBank = buildWordBank();
  const words = wordBank.words.filter(WORD_RULES[level.id]);
  const used = new Set(avoid || []);
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 300) {
    const fromNames = level.id === "difficile" && rnd() < 0.5;
    const src = fromNames ? wordBank.names : words;
    const e = src[Math.floor(rnd() * src.length)];
    if (used.has(e.word)) continue;
    // Avec la réplique affichée, il faut du contexte : ni trop courte ni trop longue
    const ctx = e.quotes.filter((q) => q.text.length >= 30 && q.text.length <= 200);
    if (level.id !== "difficile" && !ctx.length) continue;
    used.add(e.word);
    const short = e.quotes.filter((q) => q.text.length <= 200);
    const list = ctx.length ? ctx : short.length ? short : e.quotes;
    out.push({ word: e.word, shown: e.shown, isName: Boolean(e.isName), quote: list[Math.floor(rnd() * list.length)] });
  }
  return out;
}

// Réplique dont le mot est remplacé par des cases vides
function maskedQuote(text, word) {
  const frag = document.createDocumentFragment();
  let pos = 0;
  findWord(fold(text), word).forEach((a) => {
    frag.appendChild(document.createTextNode(text.slice(pos, a)));
    const g = el("span", "gap");
    for (let k = 0; k < word.length; k++) g.appendChild(el("span", "slot", " "));
    frag.appendChild(g);
    pos = a + word.length;
  });
  frag.appendChild(document.createTextNode(text.slice(pos)));
  return frag;
}

// Explication du jeu : exemple en tuiles, puis les règles en trois lignes
function wordleHelp() {
  const box = el("div", "help");
  box.appendChild(el("p", "", "Une réplique de la série a perdu un mot. Aux niveaux Écuyer et Chevalier elle est affichée avec un trou ; au niveau Roi, tu devines sans elle. Tu as six essais : tape un mot de la même longueur, puis valide. Chaque lettre prend une couleur."));
  const grid = el("div", "wgrid help-grid");
  const line = el("div", "wline");
  [["t", "present"], ["o", "ok"], ["m", "absent"], ["b", "absent"], ["e", "ok"]].forEach(([c, st]) => line.appendChild(el("span", "tile filled " + st, c)));
  grid.appendChild(line);
  box.appendChild(el("p", "", "Exemple : le mot est PORTE et tu essaies TOMBE."));
  box.appendChild(grid);
  const legend = el("ul", "help-legend");
  [["O, E", "vertes : bien placées."], ["T", "dorée : dans le mot, mais ailleurs."], ["M, B", "grises : absentes du mot."]].forEach(([a, b]) => {
    const li = el("li");
    li.append(el("span", "tag", a), el("span", "", b));
    legend.appendChild(li);
  });
  box.appendChild(legend);
  box.appendChild(el("p", "", "Mot trouvé, mot suivant : la série s'arrête au premier échec. Seuls les vrais mots français sont acceptés, sans accents : é, è et ê s'écrivent e. Après deux essais ratés, tu peux demander jusqu'à deux indices."));
  return box;
}

function playWordle(root, src, onFinish, onQuit) {
  const answers = src.first.slice();
  const MAX_TRIES = 6;
  const KEYROWS = ["azertyuiop", "qsdfghjklm", "wxcvbn"];
  let i = 0, score = 0, over = true, busy = false, hintLevel = 0, lastScore = -1;
  let ans = null, L = 0, row = 0, cur = "";
  let lines = [];
  const keyBtns = {};

  root.innerHTML = "";
  const tally = el("div", "tally");
  const num = el("span");
  const sc = el("span");
  const quit = el("button", "back", "Arrêter");
  quit.type = "button";
  quit.onclick = () => onQuit({ score });
  tally.append(num, sc, feelToggle(), quit);

  const stage = el("div");
  const grid = el("div", "wgrid");
  grid.setAttribute("role", "group");
  grid.setAttribute("aria-label", "Essais");
  const feedback = el("div", "feedback");
  feedback.setAttribute("aria-live", "polite");
  const tools = el("div", "wtools");
  const hintBtn = el("button", "linklike", "Un indice");
  hintBtn.type = "button";
  tools.appendChild(hintBtn);
  const hint = el("div", "whint");
  const context = el("div", "wcontext");
  stage.append(context, grid, feedback, tools, hint);

  const keys = el("div", "wkeys");
  KEYROWS.forEach((letters, r) => {
    const line = el("div", "wkrow");
    if (r === 2) line.appendChild(mkKey("Entrée", "Valider", submit, true));
    letters.split("").forEach((c) => line.appendChild(mkKey(c, c.toUpperCase(), () => typeLetter(c), false, c)));
    if (r === 2) line.appendChild(mkKey("⌫", "Effacer", backspace, true));
    keys.appendChild(line);
  });
  function mkKey(label, aria, fn, wide, letter) {
    const b = el("button", "wkey" + (wide ? " wide" : ""), label);
    b.type = "button";
    b.setAttribute("aria-label", aria);
    b.onmousedown = (e) => e.preventDefault();
    b.onclick = fn;
    if (letter) keyBtns[letter] = b;
    return b;
  }

  const actions = el("div", "actions");
  const next = el("button", "btn primary");
  next.hidden = true;
  actions.appendChild(next);
  root.append(tally, stage, keys, actions);

  function paintTally() {
    num.textContent = "Série : " + score;
    sc.textContent = "Record : " + (Math.max(src.best, score) || "–");
    if (lastScore >= 0 && score > lastScore) bump(num);
    lastScore = score;
  }

  function show() {
    ans = answers[i];
    L = ans.word.length;
    row = 0; cur = ""; over = false; busy = false; hintLevel = 0;
    hintBtn.textContent = "Un indice";
    context.replaceChildren();
    context.hidden = false;
    if (src.level !== "difficile") {
      if (src.level === "facile") context.appendChild(el("p", "speaker", ans.quote.perso + " :"));
      const qp = el("p", "hit-text");
      qp.appendChild(maskedQuote(ans.quote.text, ans.word));
      context.appendChild(qp);
    }
    grid.textContent = "";
    grid.style.setProperty("--cols", L);
    lines = [];
    for (let r = 0; r < MAX_TRIES; r++) {
      const line = el("div", "wline");
      for (let c = 0; c < L; c++) line.appendChild(el("span", "tile"));
      grid.appendChild(line);
      lines.push(line);
    }
    Object.keys(keyBtns).forEach((c) => { keyBtns[c].className = "wkey"; });
    hint.replaceChildren();
    hintBtn.hidden = true;
    keys.hidden = false;
    next.hidden = true;
    paintTally();
    feedback.textContent = L + " lettres, six essais.";
    replay(stage);
  }

  function paintRow() {
    [...lines[row].children].forEach((t, c) => {
      t.textContent = cur[c] ? cur[c].toUpperCase() : "";
      t.classList.toggle("filled", Boolean(cur[c]));
    });
  }
  function typeLetter(c) {
    if (over || busy || cur.length >= L) return;
    cur += c;
    paintRow();
    const t = lines[row].children[cur.length - 1];
    t.classList.remove("pop");
    void t.offsetWidth;
    t.classList.add("pop");
    feel.sfx("tap");
  }
  function backspace() {
    if (over || busy || !cur.length) return;
    cur = cur.slice(0, -1);
    paintRow();
  }

  function rate(guess) {
    const res = Array(L).fill("absent");
    const left = {};
    for (let k = 0; k < L; k++) {
      if (guess[k] === ans.word[k]) res[k] = "ok";
      else left[ans.word[k]] = (left[ans.word[k]] || 0) + 1;
    }
    for (let k = 0; k < L; k++) {
      if (res[k] !== "ok" && left[guess[k]] > 0) { res[k] = "present"; left[guess[k]]--; }
    }
    return res;
  }

  function submit() {
    if (over || busy) return;
    if (cur.length < L) {
      const miss = L - cur.length;
      feedback.textContent = "Il manque " + miss + (miss > 1 ? " lettres." : " lettre.");
      lines[row].classList.remove("shake");
      void lines[row].offsetWidth;
      lines[row].classList.add("shake");
      feel.sfx("miss");
      return;
    }
    if (!isValidGuess(cur)) {
      feedback.textContent = "« " + cur.toUpperCase() + " » n'est pas dans le dictionnaire.";
      lines[row].classList.remove("shake");
      void lines[row].offsetWidth;
      lines[row].classList.add("shake");
      feel.sfx("miss");
      return;
    }
    const guess = cur;
    const res = rate(guess);
    const line = lines[row];
    busy = true;
    feedback.textContent = "";
    const words = { ok: "bien placée", present: "dans le mot, mal placée", absent: "absente" };
    [...line.children].forEach((t, k) => {
      t.style.animationDelay = k * 120 + "ms";
      t.classList.add("flip");
      setTimeout(() => {
        t.classList.add(res[k]);
        feel.sfx("flip", res[k] === "ok" ? 740 : res[k] === "present" ? 560 : 300);
        t.setAttribute("aria-label", guess[k].toUpperCase() + ", " + words[res[k]]);
      }, k * 120 + 220);
    });
    setTimeout(() => {
      const rank = { absent: 0, present: 1, ok: 2 };
      guess.split("").forEach((c, k) => {
        const b = keyBtns[c];
        const have = b.classList.contains("ok") ? "ok" : b.classList.contains("present") ? "present" : b.classList.contains("absent") ? "absent" : null;
        if (have === null || rank[res[k]] > rank[have]) {
          b.classList.remove("ok", "present", "absent");
          b.classList.add(res[k]);
        }
      });
      busy = false;
      if (guess === ans.word) {
        [...line.children].forEach((t, k) => {
          t.classList.remove("flip");
          t.style.animationDelay = k * 70 + "ms";
          t.classList.add("jump");
        });
        finishWord(true);
        return;
      }
      if (row + 1 >= MAX_TRIES) { finishWord(false); return; }
      row++; cur = "";
      if (row >= 2 && hintLevel < 2) hintBtn.hidden = false;
    }, L * 120 + 450);
  }

  // Indices progressifs, adaptés à ce qui est déjà visible :
  // Écuyer et Chevalier : d'où vient la réplique ou qui parle, puis la première lettre.
  // Roi (sans réplique) : qui parle ou qui joue le personnage, puis la réplique avec le mot caché.
  hintBtn.onclick = () => {
    if (over || hintLevel >= 2) return;
    hintLevel++;
    const q = ans.quote;
    const lv = src.level;
    const where = [q.livre, q.episode].filter(Boolean).join(" · ");
    const h1 = lv === "facile" ? "Indice 1 : cette réplique est tirée de " + where + "."
      : ans.isName ? "Indice 1 : ce personnage est joué par " + (q.acteur || "un acteur de la série") + "."
      : "Indice 1 : c'est " + q.perso + " qui parle" + (q.livre ? " (" + q.livre + ")" : "") + ".";
    const parts = [el("p", "tag", h1)];
    if (hintLevel === 2) {
      if (lv === "difficile") {
        const p = el("p", "hit-text");
        p.appendChild(maskedQuote(q.text, ans.word));
        parts.push(el("p", "tag", ans.isName ? "Indice 2 : une réplique de ce personnage." : "Indice 2 : la réplique d'où vient le mot."), p);
      } else {
        parts.push(el("p", "tag", "Indice 2 : le mot commence par " + ans.word[0].toUpperCase() + "."));
      }
    }
    hint.replaceChildren(...parts);
    hintBtn.textContent = "Un autre indice";
    hintBtn.hidden = hintLevel >= 2;
  };

  function finishWord(won) {
    over = true;
    const tries = row + 1;
    ans.won = won;
    if (won) score++;
    feel.sfx(won ? "win" : "lose");
    keys.hidden = true;
    hintBtn.hidden = true;
    context.hidden = true;
    feedback.textContent = "";
    feedback.appendChild(el("span", "verdict " + (won ? "ok" : "ko"),
      won ? "Trouvé en " + tries + (tries > 1 ? " essais." : " essai.")
          : "Raté : c'était « " + ans.shown + " »."));
    const quoteP = el("p", "hit-text");
    quoteP.appendChild(markedText(ans.quote.text, fold(ans.quote.text), [ans.word], true));
    const colo = el("p", "hit-colo");
    colo.append(
      el("span", "who", ans.quote.perso + (ans.quote.acteur ? " · " + ans.quote.acteur : "")),
      el("span", "where", [ans.quote.livre, ans.quote.episode].filter(Boolean).join(" · "))
    );
    hint.replaceChildren(el("p", "tag", "Le mot vient de cette réplique :"), quoteP, colo);
    paintTally();
    next.textContent = won ? "Mot suivant" : "Voir le résultat";
    next.hidden = false;
    next.focus({ preventScroll: true });
  }

  function onKey(e) {
    if (!stage.isConnected) return;
    if ($("view-play").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
    if (e.key === "Enter") { e.preventDefault(); submit(); return; }
    if (e.key === "Backspace") { e.preventDefault(); backspace(); return; }
    if (e.key.length === 1) {
      const c = plain(e.key);
      if (/^[a-z]$/.test(c)) typeLetter(c);
    }
  }
  document.addEventListener("keydown", onKey);

  next.onclick = () => {
    if (!ans.won) { document.removeEventListener("keydown", onKey); onFinish({ score }); return; }
    i++;
    if (i >= answers.length) {
      const more = src.more();
      if (!more.length) { document.removeEventListener("keydown", onKey); onFinish({ score }); return; }
      answers.push(...more);
    }
    show();
  };
  show();
  return { destroy() { document.removeEventListener("keydown", onKey); } };
}

function streakVerdict(n) {
  if (n === 0) return "Dès la première : le château a connu pire.";
  if (n < 3) return "Un début. Les chevaliers ont des progrès à faire.";
  if (n < 6) return "Honorable. Il reste des coins sombres au château.";
  if (n < 10) return "Bien joué : tu as dû regarder la série plusieurs fois.";
  if (n < 20) return "Excellent. La Table Ronde t'ouvre ses portes.";
  return "Légendaire. Même Merlin n'y croit pas.";
}

/* Publication du score dans le classement commun (si activé) */
function publishBox(boardId, score) {
  if (!board.enabled()) return null;
  const wrap = el("div", "publish");
  const input = el("input");
  input.type = "text";
  input.maxLength = 20;
  input.autocomplete = "nickname";
  input.value = store.get("kmt-name") || "";
  input.id = "pub-" + Math.random().toString(36).slice(2, 8);
  const label = el("label", "", "Inscrire ce score au classement ? Choisis le nom qui s'affichera.");
  label.htmlFor = input.id;
  const btn = el("button", "btn primary", "Publier");
  const skip = el("button", "btn", "Non merci");
  skip.onclick = () => { wrap.replaceChildren(el("p", "publish-msg", "D'accord, rien n'est envoyé.")); };
  const row = el("div", "row");
  row.append(input, btn, skip);
  const msg = el("p", "publish-msg");
  msg.setAttribute("aria-live", "polite");

  btn.onclick = async () => {
    const name = input.value.trim().slice(0, 20);
    if (!name) { msg.textContent = "Écris un nom d'abord."; input.focus(); return; }
    btn.disabled = true;
    msg.textContent = "Envoi en cours…";
    try {
      await board.post(boardId, name, score);
      store.set("kmt-name", name);
      delete rankCache[boardId];
      input.disabled = true;
      skip.hidden = true;
      msg.textContent = "Score publié. ";
      const go = el("button", "linklike", "Voir le classement");
      go.onclick = () => openRecords(boardId);
      msg.appendChild(go);
    } catch (e) {
      btn.disabled = false;
      msg.textContent = "Publication impossible (" + e.message + ").";
    }
  };
  wrap.append(label, row, msg);
  return wrap;
}

  svg.setAttribute("viewBox", "0 0 48 48");
  svg.setAttribute("class", "lv-svg");

  if (id === "facile") {
    mk("path", { d: "M24 5 L40 10 V23 C40 33 33 40 24 45 C15 40 8 33 8 23 V10 Z", class: "ink" }, svg);

const LEVEL_RANK = { facile: 1, moyen: 2, difficile: 3 };

let currentRound = null;

// Arrêt volontaire : on garde la série en cours, on reprend, ou on quitte sans rien enregistrer
function stopRound(mode, lv, st) {
  const root = $("play-root");
  const saved = [...root.childNodes];
  const n = st.score;
  root.replaceChildren();

  const wrap = el("div", "result");
  const title = el("h2", "result-title", "Pause.");
  title.tabIndex = -1;
  wrap.appendChild(title);
  wrap.appendChild(el("p", "", n === 0
    ? "Tu n'as encore rien trouvé : il n'y a rien à garder."
    : "Ta série en cours est de " + n + ". Veux-tu la garder ?"));

  const actions = el("div", "actions stack");
  const resume = el("button", "btn" + (n === 0 ? " primary" : ""), "Reprendre");
  resume.onclick = () => { root.replaceChildren(...saved); };
  if (n > 0) {
    const keep = el("button", "btn primary", "Garder ma série");
    keep.onclick = () => { currentRound.destroy(); finishRound(mode, lv, st, true); };
    actions.append(keep, resume);
  } else {
    actions.appendChild(resume);
  }
  wrap.appendChild(actions);
  const drop = el("button", "back", n > 0 ? "Quitter sans enregistrer" : "Quitter");
  drop.onclick = () => { currentRound.destroy(); renderLevels(mode); };
  wrap.appendChild(drop);
  root.appendChild(wrap);
  replay(root);
  title.focus({ preventScroll: true });
}

function startRound(mode, lv) {
  if (mode.kind === "wordle" && !store.get("kmt-aide-wordle")) {
    const root = $("play-root");
    root.innerHTML = "";
    const back = el("button", "back", "← Retour");
    back.onclick = () => renderLevels(mode);
    const title = el("h2", "section-title", "Comment jouer");
    const go = el("button", "btn primary", "Compris, je joue");
    go.onclick = () => { store.set("kmt-aide-wordle", "1"); startRound(mode, lv); };
    const actions = el("div", "actions");
    actions.appendChild(go);
    root.append(back, title, wordleHelp(), actions);
    replay(root);
    return;
  }
  document.body.classList.add("playing");
  const play = { hangman: playHangman, wordle: playWordle }[mode.kind] || playRound;
  const asked = new Set();
  // Les questions arrivent par lots de 10, sans jamais répéter la même
  const more = () => {
    let qs = mode.build(lv, 10, Math.random, asked);
    if (!qs.length) { asked.clear(); qs = mode.build(lv, 10, Math.random, asked); }
    qs.forEach((q) => asked.add(mode.kind === "wordle" ? q.word : q.quote));
    return qs;
  };
  const best = parseInt(store.get("kmt-run-" + mode.id + "-" + lv.id), 10) || 0;
  currentRound = play($("play-root"), { first: more(), more, best, level: lv.id }, (r) => finishRound(mode, lv, r), (st) => stopRound(mode, lv, st));
}

function finishRound(mode, lv, r, partial) {
  document.body.classList.remove("playing");
  const root = $("play-root");
  const key = "kmt-run-" + mode.id + "-" + lv.id;
  store.set("kmt-board", mode.id + "-" + lv.id);
  const prev = parseInt(store.get(key), 10);
  const isBest = r.score > 0 && (isNaN(prev) || r.score > prev);
  if (isBest) store.set(key, String(r.score));

  root.innerHTML = "";
  const wrap = el("div", "result");
  const title = el("h2", "result-title", partial ? "Série gardée : " + r.score + "." : r.score === 0 ? "Perdu dès le premier." : "Série de " + r.score + ".");
  title.tabIndex = -1;
  wrap.appendChild(title);
  if (!partial) wrap.appendChild(el("p", "", streakVerdict(r.score)));
  if (r.score > 0) {
    const where = mode.name + ", niveau " + lv.name;
    const line = isBest
      ? (isNaN(prev) ? "Premier record : " + where + "." : "Nouveau record : " + where + ". L'ancien était de " + prev + ".")
      : "Ton record reste de " + prev + " (" + where + ").";
    wrap.appendChild(el("p", "", line));
  }
  const pub = r.score > 0 ? publishBox(mode.id + "-" + lv.id, r.score) : null;
  if (pub) wrap.appendChild(pub);

  const actions = el("div", "actions");
  const again = el("button", "btn primary", "Rejouer");
  again.onclick = () => startRound(mode, lv);
  const other = el("button", "btn", "Changer de niveau");
  other.onclick = () => renderLevels(mode);
  actions.append(again, other);
  wrap.appendChild(actions);
  root.appendChild(wrap);
  replay(root);
  title.focus({ preventScroll: true });
}

/* ===== Onglet Classement : le classement d'abord, puis mes records ===== */
let pendingBoard = null;
let rankBoard = null;
let rankReq = 0;
const rankCache = {};
const cellBtns = {};
const modeBtns = {};
const levelBtns = {};

function openRecords(id) {
  pendingBoard = id;
  showTab("records");
}

function boardParts(id) {
  const k = String(id).split("-");
  return { mode: MODES[k[0]], lv: levels[k[1]] };
}

function renderRecords() {
  const root = $("records-root");
  const on = board.enabled();
  root.innerHTML = "";
  if (pendingBoard) { rankBoard = pendingBoard; pendingBoard = null; }
  if (!rankBoard) rankBoard = store.get("kmt-board") || "qui-facile";
  const bp = boardParts(rankBoard);
  if (!bp.mode || !bp.lv) rankBoard = "qui-facile";

  if (on) root.appendChild(buildBoard());
  root.appendChild(buildMine(on));
  if (on) { paintBoardHead(); loadRanking(false); }
  replay(root);
}

// Le classement : titre, choix du jeu et du niveau, puis le palmarès
function buildBoard() {
  const sec = el("section", "board");
  const head = el("div", "board-head");
  head.appendChild(el("h2", "board-title", "Classement"));
  const refresh = el("button", "linklike", "Actualiser");
  refresh.type = "button";
  refresh.onclick = () => loadRanking(true);
  head.appendChild(refresh);

  const modes = el("div", "picker");
  modes.setAttribute("role", "group");
  modes.setAttribute("aria-label", "Jeu");
  Object.values(MODES).forEach((m) => {
    const b = el("button", "chip");
    b.append(gameIcon(m.id), document.createTextNode(m.name));
    b.type = "button";
    b.onclick = () => selectBoard(m.id + "-" + boardParts(rankBoard).lv.id);
    modeBtns[m.id] = b;
    modes.appendChild(b);
  });
  const lvls = el("div", "picker");
  lvls.setAttribute("role", "group");
  lvls.setAttribute("aria-label", "Niveau");
  Object.values(levels).forEach((lv) => {
    const b = el("button", "chip");
    b.type = "button";
    b.append(levelIcon(lv.id), document.createTextNode(lv.name));
    b.onclick = () => selectBoard(boardParts(rankBoard).mode.id + "-" + lv.id);
    levelBtns[lv.id] = b;
    lvls.appendChild(b);
  });

  const sub = el("p", "board-sub");
  sub.id = "board-sub";
  const me = el("p", "board-me");
  me.id = "board-me";
  me.hidden = true;
  const box = el("div");
  box.id = "ranking";
  box.setAttribute("aria-live", "polite");
  const actions = el("div", "actions");
  const play = el("button", "btn primary", "Jouer ce niveau");
  play.onclick = () => { const b = boardParts(rankBoard); showTab("play"); startRound(b.mode, b.lv); };
  actions.appendChild(play);
  sec.append(head, modes, lvls, sub, me, box, actions);
  return sec;
}

// Mes records : un tableau jeu x niveau, qui sert aussi de raccourci vers le classement
function buildMine(on) {
  const sec = el("section", on ? "mine-records" : "");
  sec.appendChild(el("h2", "section-title", "Mes records"));
  const table = el("table", "matrix");
  const cap = el("caption", "sr-only", "Mes plus longues séries par jeu et par niveau");
  const head = el("tr");
  head.appendChild(el("td"));
  Object.values(levels).forEach((lv) => {
    const th = el("th");
    th.scope = "col";
    th.append(levelIcon(lv.id), document.createTextNode(lv.name));
    head.appendChild(th);
  });
  const thead = el("thead");
  thead.appendChild(head);
  const body = el("tbody");
  Object.values(MODES).forEach((m) => {
    const tr = el("tr");
    const th = el("th");
    th.scope = "row";
    const rowhead = el("span", "rowhead");
    rowhead.append(gameIcon(m.id), document.createTextNode(m.name));
    th.appendChild(rowhead);
    tr.appendChild(th);
    Object.values(levels).forEach((lv) => {
      const id = m.id + "-" + lv.id;
      const v = store.get("kmt-run-" + id);
      const c = el(on ? "button" : "span", "cell-btn" + (v === null ? " empty" : ""));
      c.appendChild(el("span", "val", v === null ? "–" : v));
      if (on) {
        c.type = "button";
        c.setAttribute("aria-pressed", String(id === rankBoard));
        c.setAttribute("aria-label", m.name + ", " + lv.name + " : " + (v === null ? "pas encore joué" : "record " + v) + ". Voir le classement.");
        c.onclick = () => {
          selectBoard(id);
          const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          document.querySelector(".board").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
        };
        cellBtns[id] = c;
      }
      const td = el("td");
      td.appendChild(c);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  table.append(cap, thead, body);
  sec.appendChild(table);
  sec.appendChild(el("p", "records-hint", on ? "Touche une case pour voir son classement." : "Le classement commun n'est pas encore activé. Tes records restent sur cet appareil."));
  return sec;
}

function selectBoard(id) {
  rankBoard = id;
  store.set("kmt-board", id);
  paintBoardHead();
  loadRanking(false);
}

function paintBoardHead() {
  const b = boardParts(rankBoard);
  Object.keys(modeBtns).forEach((k) => modeBtns[k].setAttribute("aria-pressed", String(k === b.mode.id)));
  Object.keys(levelBtns).forEach((k) => levelBtns[k].setAttribute("aria-pressed", String(k === b.lv.id)));
  Object.keys(cellBtns).forEach((k) => cellBtns[k].setAttribute("aria-pressed", String(k === rankBoard)));
  const v = store.get("kmt-run-" + rankBoard);
  const sub = $("board-sub");
  sub.textContent = v !== null ? "Ton record : " + v + "." : "Tu n'y as pas encore joué.";
}

async function loadRanking(force) {
  const id = rankBoard;
  const box = $("ranking");
  const req = ++rankReq;
  const c = rankCache[id];
  if (!force && c && Date.now() - c.at < 30000) { paintRanking(c.rows); return; }
  $("board-me").hidden = true;
  box.replaceChildren(...[1, 2, 3, 4].map(() => el("div", "skel")));
  try {
    const rows = await board.rows(id);
    rankCache[id] = { at: Date.now(), rows };
    if (req !== rankReq) return;
    paintRanking(rows);
  } catch (e) {
    if (req !== rankReq) return;
    box.replaceChildren(el("p", "note error", "Le registre est injoignable (" + e.message + "). Réessaie dans un instant."));
  }
}

function paintRanking(rows) {
  const box = $("ranking");
  const meLine = $("board-me");
  if (!rows.length) {
    meLine.hidden = true;
    box.replaceChildren(el("p", "board-empty", "Personne n'a encore publié ici. Le premier nom gravé sera le tien."));
    return;
  }
  const me = (store.get("kmt-name") || "").trim().toLowerCase();
  const isMe = (r) => me && String(r.name).toLowerCase() === me;
  const mine = rows.findIndex(isMe);
  meLine.hidden = false;
  meLine.textContent = mine >= 0
    ? (mine === 0 ? "Tu es en tête du classement." : "Tu es " + (mine + 1) + (mine === 0 ? "er" : "e") + " sur " + rows.length + ".")
    : "Tu n'es pas encore dans ce classement : joue et publie ta série pour y entrer.";

  const nodes = [];
  let rest = rows;
  let from = 0;
  if (rows.length >= 3) {
    const pod = el("div", "podium");
    [1, 0, 2].forEach((idx) => {
      const r = rows[idx];
      const b = el("div", "pod pod" + (idx + 1) + (isMe(r) ? " me" : ""));
      if (idx === 0) b.appendChild(levelIcon("difficile"));
      b.append(el("span", "pod-rank", String(idx + 1)), el("span", "pod-name", String(r.name)), el("span", "pod-score", String(r.score)));
      pod.appendChild(b);
    });
    nodes.push(pod);
    rest = rows.slice(3);
    from = 3;
  }
  if (rest.length) {
    const list = el("ol", "ranking");
    rest.forEach((r, k) => {
      const place = from + k + 1;
      const li = el("li", (isMe(r) ? "me " : "") + (place <= 3 ? "top " : "") + (place === 1 ? "first" : ""));
      const nick = el("span", "nick", String(r.name));
      if (isMe(r)) nick.appendChild(el("span", "tag", "toi"));
      li.append(el("span", "rank", String(place)), nick, el("span", "pts", String(r.score)));
      list.appendChild(li);
    });
    nodes.push(list);
  }
  box.replaceChildren(...nodes);
}

load();

// Hors ligne et installation : le service worker n'existe que sur http(s)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
