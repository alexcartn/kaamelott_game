aroline Ferrus","personnage":"Mevanwi","saison":"Livre IV","episode":"La Chambre de la reine"}},{"citation":"Une fois j'ai dormi avec un porc pendant une semaine. [Arthur: Un porc entier?]\r\nUn porc vivant.","infos":{"auteur":"Alexandre Astier","acteur":"Caroline Ferrus","personnage":"Mevanwi","saison":"Livre IV","episode":"La Chambre de la reine"}},{"citation":"Au départ, je devais vous guider vers la lumière, vers le Graal. Mais vous, vous préférez n'en faire qu'à votre tête : Lancelot s'en va ? Pas grave, qu'il s'en aille ! Guenièvre part avec lui ? Eh ben qu'elle se tire, ça fera de l'air ! Il faut jamais convoiter la femme d'un autre chevalier ? Ben eh, je m'en fous, moi. Je la convoite quand même ! Résultat : Bannie ! Ah vous pouvez être fier de vous ! (elle pleure)","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre IV","episode":"La Révoquée"}},{"citation":"Je sais ni boire, ni manger, ni m'habiller, ni me laver, ni rien ! Vous sentez que je vais être un fardeau pour vous, ou pas ?","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre IV","episode":"La Révoquée"}},{"citation":"(Terrorisée) Ils m'ont ba... Ils m'ont ba... (Arthur essaie divers mots) ILS M'ONT BANNIE!","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre IV","episode":"La Révoquée"}},{"citation":"(À Arthur au sujet de Mevanwi) Je dois avouer que la chose a du bon, si c'est pour m'éviter la vue de la grande décarade, le défilé des nouvelles têtes, la parade des amoureuses à calcul, les poids lourds de la jambe légère, le festival de la morue, en somme...","infos":{"auteur":"Alexandre Astier","acteur":"Vanessa Guedj","personnage":"Angharad","saison":"Livre IV","episode":"Les Bonnes"}},{"citation":"Ah bah non ! On va leur foutre deux, trois pierres dans la gueule et on va allumer des incendies... Mais faut pas déconner, ils y sont pour rien.","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre IV","episode":"La Révolte III"}},{"citation":"Bon ben je vous préviens, je vous écoute 30 secondes pas une de plus. Si il y a un mot plus haut que l'autre, je vous mets toute la tartine dans la gueule et je rentre chez moi, j'ai pas que ça à glander.","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre IV","episode":"La Révolte III"}},{"citation":"Non mais vous croyez pas qu'j'marche au sifflet ! Mais qu'est-ce que j'en ai à foutre de vos horaires ? J'arrive quand j'arrive et puis c'est tout.","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre IV","episode":"La Révolte III"}},{"citation":"Et si on envoyait quelqu'un qui se faufile dans leur camp sans se faire repérer pour observer leurs faits et gestes ? […] Ou alors, ça fait doublon avec l'espionnage ? Je me rends pas compte.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"Le Rapport"}},{"citation":"(À Mévanwi) : Oh bah c'est normal ça, moi si j'avais foutu un royaume en l'air et qu'la pérennité d'une civilisation tout entière était remise en question à cause de mes p'tites coucheries, moi non plus j'me sentirais pas bien...","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre IV","episode":"L'Art de la Table"}},{"citation":"(À Dame Séli)En somme, il faudrait déclarer la guerre à Lancelot pour récupérer la Reine et donner un héritier au trône, en tablant sur l'éventualité que la Reine est enceinte et pas d'une fille? [Dame Séli : En somme] Et c'est moi le paramètre hasardeux ?","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"Les Novices"}},{"citation":"(À Lancelot)Eh ben, on est pas sortie du sable !","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre IV","episode":"Les Novices"}},{"citation":"(À Lancelot)On a beau expliquer tout ce qu'on veut expliquer… Au bout d'un moment, pour savoir faire du cheval, il faut faire du cheval !","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre IV","episode":"Les Novices"}},{"citation":"Pour tout vous dire, je crois pas que ce soit bon pour mon autorité que mes soldats apprennent que je suis \"une grosse pucelle\" !","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre IV","episode":"Les Novices"}},{"citation":"Moi, je suis en charge des négociations protocolaires de la surveillance intérieure de l'inspection de certains postes avancés, eh bien, voyez-vous, si on me disait : Bohort, tout ça c'est fini, à partir de maintenant, vous vous occuperez des pâtisseries et du linge de maison, je vous assure, je n'hésiterai pas une seconde .","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre IV","episode":"Le Renoncement : 1ère partie"}},{"citation":"Qui veut une tartelette ?","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre IV","episode":"Les Tuteurs II"}},{"citation":"Admirez-nous un peu après trente ans de souplesse… Trente ans d'éducation laxiste !… Entre la fille princesse qui abandonne le trône pour mettre les bouts dans la forêt avec un jean-foutre et le fils chevalier qui sait pas tenir sa cuillère et qui est pas foutu de se lever avant midi, vous verrez qu'à force d'être souples, on va finir par passer définitivement pour des romanos ! Et ils se sont pas levés !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre IV","episode":"Le Grand Départ"}},{"citation":"Nous sommes jeunes, nous marchons à pieds… J'opterai donc pour un surnom en rapport : \"les Petits Pédestres\".","infos":{"auteur":"Alexandre Astier","acteur":"Aurélien Portehaut","personnage":"Gauvain","saison":"Livre IV","episode":"Le Grand Départ"}},{"citation":"Les oiseaux sifflent, le printemps siffle !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre IV","episode":"Les Envahisseurs"}},{"citation":"Non, je suis désolé, c'est pas possible ; on se lève pas à midi dans un camp militaire ! Demain matin, celui qui est pas debout à l'aube, je le pends à un arbre, c'est clair ?","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre IV","episode":"La réponse"}},{"citation":"Écoutez, si j'avais un sort pour contrecarrer les volontés divines, je serais pas en train de faire des potions de virilité pour tous les mous de la tige du pays breton.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre IV","episode":"Anges Et Démons"}},{"citation":"(À Arthur) Croyez bien que si j'avais [un truc en stock pour aider Merlin], je le dirais pas ! Parce que voir celui-là passer pour un conneau devant tous les druides du continent, j'aime autant vous dire que je risque pas de louper ça ! J'vais même amener des copains.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre IV","episode":"Le rassemblent du corbeau II"}},{"citation":"Je préfère vous tuer de mes mains plutôt que de vous perdre.","infos":{"auteur":"Alexandre Astier","acteur":"Thomas Cousseau","personnage":"Lancelot","saison":"Livre IV","episode":"La Rémanence"}},{"citation":"Moi, quand ma garce de femme est là, ça déménage pas mal aussi… Hier, elle m'a fendu le tibia avec une amphore, la salope !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"La Rémanence"}},{"citation":"Commencez pas à noyer la peau de l'ours avant d'avoir vendu le poisson.","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre IV","episode":"Vox populi III"}},{"citation":"Et qu'est-ce qui font-ils, au gouvernement ? Y's'roucent les poules ! Y's'poulent les rouces ! [Guethenoc : Y's'roulent les pouces !] Voilà, mieux !","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre IV","episode":"Vox populi III"}},{"citation":"Moi, un jour j'ai rêvé qu'y avait un type qui venait me voir. Il me dit : «Vous avez jamais connu vos parents ?» J'lui réponds «non». Et là, il me dit : «Eh ben, vous inquiétez pas, ils sont fromagers.»","infos":{"auteur":"Alexandre Astier","acteur":"Thibault Roux","personnage":"Grüdü","saison":"Livre IV","episode":"Le Rêve d'Ygerne"}},{"citation":"Arthour, j'apprécie les fruits au sirop !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre IV","episode":"Le Jeu de la guerre"}},{"citation":"Jouer ! Guerre ! Salsifis !","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre IV","episode":"Le Jeu de la guerre"}},{"citation":"SALSIFIS !!!!!!","infos":{"auteur":"Alexandre Astier","acteur":"Guillaume Briat","personnage":"Le Roi Burgonde","saison":"Livre IV","episode":"Le Jeu de la guerre"}},{"citation":"[À Lancelot]  Ah ! À ce propos, je dois vous avouer que j'ai longtemps réflechi à savoir comment vous deviez m'appeler. [...] Éh oui ! Parce que vous êtes pas, à proprement parler, un de mes sujets. Vous êtes pas sous mes ordres non plus. \"Sire\" c'est quand même un peu ampoulé. Alors j'ai pensé à beaucoup de choses. \"Loth\", \"Seigneur\", \"Monsieur\"... Je me suis même demandé si vous deviez pas m'appeler \"vieille branche\", \"mon p'tit pote\" ou \"canaillou\".","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Loth et le Graal"}},{"citation":"[À Lancelot] Alors là, pareil. J'vais dire une banalité : Ne jamais négliger les bienfaits du couple dans la fonction militaire ; surtout quand on est à poste de décisions. Moi, j'ai toujours mené mes troupes de façon laborieuse et pénible, pourquoi ? Avant tout -faut pas s'le cacher- parce que ma femme est une grosse salope.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Loth et le Graal"}},{"citation":"(A Lancelot) Et ben allez-y, recevez-le dans la merde. Y'a pas un siège pour s'asseoir, pas un truc à lui offrir à boire (...) C'est le roi d'Orcanie quand même. C'est pas Jo le Clodo. ","infos":{"auteur":"Alexandre Astier","acteur":"Alexis Hénon","personnage":"Galessin","saison":"Livre IV","episode":"Loth et le Graal"}},{"citation":"Dans trois jours, ma tata elle m'emmène à la mer pour me noyer.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre IV","episode":"Le Paladin"}},{"citation":"J'y suis dans ma maison pourrie.Les 2 pieds dans la merde de poules. Ça vous va ?","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Salomone","personnage":"Caius Camillus","saison":"Livre IV","episode":"Fluctuat nec mergitur"}},{"citation":"Ça pique trop de la vie, quoi : ça pique, ça lance, et derrière, comment ça re-pique trop.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"La Blessure d'Yvain"}},{"citation":"Il s'est acharné sur moi avec une sauvagerie mêlée de férocité. […] Celui qu'avait qu'une jambe. […] Oui, bah du coup, c'était le plus hargneux. C'était comme s'il se vengeait sur moi de sa jambe euh... Avec une sauvagerie mêlée de férocité.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"La Blessure d'Yvain"}},{"citation":"ALLEZ, EN GARDE GROSSE CONNE ! Non, ça va pas, ça va pas !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre IV","episode":"Corpore sano II"}},{"citation":"Du nerf, mon lapinou !… Vous allez vous faire tailler le zizi en pointe !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre IV","episode":"Corpore sano II"}},{"citation":"Non mais c'est à se coincer les parties dans une porte !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre IV","episode":"Corpore sano II"}},{"citation":"(Sur l'air de \"À la Volette\") Le bon roi Arthur est une p'tite tapette. Le bon roi Arthur est une p'tite tapette. Est une p'tite à la volette, est une p'tite à la volette, est une p'tite tapette.","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre IV","episode":"Corpore sano II"}},{"citation":"Vous savez quoi, Sire ? On va commencer par se faire une saucisse grillée de trois pieds de long, avec un tonnelet de pinard chacun, et derrière, peut être bien qu'on se paiera des filles. Ah oui ! A un moment, vive la vie !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Bujeau","personnage":"Le Maître d'Armes","saison":"Livre IV","episode":"Corpore sano II"}},{"citation":"(À Guethenoc) Je vous donnerai la main, j'en ai une aussi de masse moi aussi, comme ça j'en profiterai pour vous en mettre un coup dans la gueule, c'est pas bien méchant ! (Il commence à se battre avec Guethenoc)","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre IV","episode":"L'Entente Cordiale"}},{"citation":"(À Merlin) Je veux insinuer que vous n'avez pas de connaissances suffisantes pour faire des crêpes. Alors vous imaginer en train de bricoler des plaques de dissimulation, c'est à pisser de rire.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre IV","episode":"Les plaques de dissimulation"}},{"citation":"C'est pas que c'est difficile de la récupérer... C'est que c'est sa mère difficile de la récupérer, la race de sa grand-mère !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"Le Vice De Forme"}},{"citation":"Ouais, ben si vous vouliez du captivant, fallait peut-être me faire lire autre chose que des textes de lois !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Robert Lombard","personnage":"Père Blaise","saison":"Livre IV","episode":"Le Vice De Forme"}},{"citation":"Heureusement qu'on n'a aucune dignité… Sinon on serait bien dans la merde.","infos":{"auteur":"Alexandre Astier","acteur":"Antoine de Caunes","personnage":"Dagonet","saison":"Livre IV","episode":"Le Désordre et la Nuit"}},{"citation":"Juste à notre aplomb, une corneille est posée sur une branche. Dans quelques secondes, elle va s'envoler. (La corneille s'envole.) Voilà. Nous avons franchi le solstice d'été. Et pendant que d'autres célèbrent le jour le plus interminable de l'année… nous allons secrètement nous réjouir du retour des longues nuits. (Pause) Levez-vous.","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre IV","episode":"Le Désordre et la Nuit"}},{"citation":"C'était quand la dernière fois qu'on s'est retrouvés tous d'accord sur un truc !?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"Au service secret de Sa Majesté"}},{"citation":"Oh Là ! Attendez. Nous ici, on est en train de parler à quelqu'un d'intelligent. Si vous en êtes encore à respecter vos serments, on va couper court, on est tous très occupés.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Dagonet et le Cadastre"}},{"citation":"Pour faire court, vous êtes ici chez les salopards. C'est admis. On n'a pas des idées bien jojos, et on n'a pas peur de le dire ! On fomente, on renégate, on laisse libre cours à notre fantaisie.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Dagonet et le Cadastre"}},{"citation":"Voilà… Moi de mon coté j'avais parié que vous étiez encore trop branquignole pour savoir c'qui était à vous… Je vois que j'ai encore tapé juste !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Dagonet et le Cadastre"}},{"citation":"Vous êtes chevalier, je suis roi… Je vous demande de venir, vous venez et puis c'est tout !… Je vais pas non plus aller brûler un cierge sous prétexte que vous avez fait un tour de cheval !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Dagonet et le Cadastre"}},{"citation":"Là, y'a les méduses, les insectes. Là, y'a les glandus, les grouillots. Là, y'a les mecs normaux. Là, y'a les chevaliers. Là, y'a les rois et les princes. Et après, bien au-dessus, y'a le Roi Arthur. Vous, vous aurez eu deux bonhommes dans votre vie, eh ben vous pourrez dire que vous avez tapé dans l'exception.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"Duel 2eme partie"}},{"citation":"On a les mains prises ducon !!!","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"La Blessure D'Yvain"}},{"citation":"Franchement, j'ai connu des cafards moins opiniâtres...","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"La clandestine"}},{"citation":"Et ben si ils veulent la place les gars, je leur laisse !…\r\nQu'ils y viennent chercher le Graal avec la compagnie de loustics que je me promène… Je leur souhaite un bon séjour aux mecs !… Ils se les farciront, les séances de la Table Ronde où tout le monde roupille du début à la fin !… Les doléances, les revendications, les clans !… Moi, pendant ce temps-là, j'irai glander en Andalousie !… Là-bas au moins, on peut se baigner sans avoir les doigts de pieds tout bleus au bout de cinq minutes !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"La Foi bretonne"}},{"citation":"Je pense que vous glandouillez bien assez comme ça dans la réalité pour qu'on puisse se permettre d'optimiser le fictionnel.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"La Poétique II"}},{"citation":"Moi, j'étais sur qu'ils reviendraient crevés ; ils sont vivants, un succès. Mieux, une surprise.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"La Réaffectation"}},{"citation":"Vous allez voir qu'il n'y a aucun problème…\r\nSiècle des larmes, hurlements…\r\nTrès bien.\r\nAu jour, Dieu Roi de…\r\nRoi de Logres ?\r\nFait affront du Lac combattant frère à l'épée\r\nFemme de Vannes épousée commet faute\r\nPanique, ruines, fin d'un monde\r\nSur Terre, sans démons ni sorcières\r\nVient dieu des morts solitaire des frayeurs\r\nDu ciel à l'insulte la Réponse\r\n[…]\r\nLà, ça pue du cul, mais violent.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"La Réponse"}},{"citation":"Oh, la fierté… Si j'avais dû être à cheval là-dessus, je vous aurais pas épousée, déjà.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"L'Art de la table"}},{"citation":"C'est marrant parce que, d'habitude, dans les tartes, moi, je mange les fruits puis je laisse la pâte. \r\n(Arthur : Et là, vous faites l'inverse ?)\r\nHein ? Ah non, là, je laisse tout.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"La tarte aux fraises"}},{"citation":"En revanche, je suis triste pour un autre truc mais ça m'embête d'en parler... J'estime que chacun a le droit à son jardin secret.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"La tarte aux fraises"}},{"citation":"Je crois que je me suis coupé la gencive avec un grumeau cuit. C'est possible ou pas ?","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"La tarte aux fraises"}},{"citation":"[Dame Séli] Bon qu'est-ce qu'y a ? C'est pas bon ?\r\n[Arthur] Naaan mais c'est au-delà de ça je crois. L'autre jour, je rentrais de la plage et j'suis tombé sur un coin à fraises. Alors j'm'en suis fais un plein ventre ... paske les fraises, quand on leur fout la paix en fait, elles sont consommables. Là c'est aussi des fraises, probablement les mêmes d'ailleurs, mais par un procédé miraculeux, que j'arrive pas à m'imaginer ... on dirait des gadins.  ","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"La Tarte aux Fraises"}},{"citation":"Allez, faites-vous belle, que j'me pointe avec la came présentable.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"L'Échange 1ère partie"}},{"citation":"Du passé faisons table en marbre.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"L'Échelle de Perceval"}},{"citation":"Sur une échelle de 2 à 76, et là je préfère prendre large, de 2 à 71 on ne nous écoute pas, de 72 à 75, on nous écoute toujours pas, et seulement à 76 on nous laisse parler sans nous engueuler.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"L'Échelle de Perceval"}},{"citation":"Vous dites pas : «Qu'est ce qu'il fait chaud…», vous dites : «La chaleur est un plat qui se mange froid.»","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"L'Échelle de Perceval"}},{"citation":"(À Gauvain) Non, comme salope en Orcanie, y'a ma sœur, la reine, votre mère quoi, mais vous le saviez ça? ","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"Le Choix de Gauvain"}},{"citation":"Ne vous laissez pas embobiner… Ils cherchent à vous rembobiner !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"Le Choix de Gauvain"}},{"citation":"Victoriae mundis et mundis lacrima. Bon, ça ne veut absolument rien dire, mais je trouve que c'est assez dans le ton. ","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre IV","episode":"Le désordre et la nuit"}},{"citation":"Heu... à propos de devenir marteau, vous savez que chez moi ça peut aller assez loin ?\r\nParce que bon, mettons là heu... on s'pose, on analyse le truc. Le crin-crin ça fait des heures que ça dure et en plus, vous vous y mettez à plusieurs.Et ben moi le machin, une fois que j'en ai fait des copeaux, et ben je peux très bien mettre le feu au plumard ! Même au mobilier, ça m'fait pas peur !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"Le Oud II"}},{"citation":"Parce que en fait dans notre langue, il y a que deux mots qui riment avec complète : c'est quiquette et biseautée. Alors ça va être chaud !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre IV","episode":"Le Oud II"}},{"citation":"(À Merlin) Oh vous, toujours vous, mais allez chier dans une fiole, on verra après.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre IV","episode":"Le Privilégié"}},{"citation":"(À Merlin) Une pluie de pierres en intérieur, donc ! Je vous prenais pour un pied de chaise, mais vous êtes un précurseur, en fait !","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre IV","episode":"Le Privilégié"}},{"citation":"Bon ça suffit maintenant ! Vous voulez qu'j'me foute en rogne comme un enseignant ? ... Qu'est ce que j'ai avec ça moi ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Les chaperons"}},{"citation":"Vous vous prenez pour un enseignant ?... Non j' s'entais que c'était le moment d'faire une vanne mais y'a rien qui est sorti.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Les chaperons"}},{"citation":"En plus je connais une technique pour tuer trois hommes en un coup rien qu'avec des feuilles mortes ! Alors là, vous êtes deux, vous avez bien de la chance.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Les Chaperons"}},{"citation":"Mais cherchez pas à faire des phrases pourries... On en a gros, c'est tout !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Les Exploités II"}},{"citation":"Ils ont pas de bol, quand même ! Mettre au point un truc pareil et tomber sur des cerveaux comme nous !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Les Pisteurs"}},{"citation":"J'vais vous en faire préparer un de bon de sortie. Signé, tamponné, tout ce qu'il y a de plus officiel. Et puisque vous aimez les catapultes, on va vous mettre les miches dedans, vous, votre fils, votre femme, et tout l'orchestre. Et paf, feu nourri, direction Carmélide, la Bretagne vue du ciel ! Ça vous apprendra à bouffer à tous les râteliers.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"Le Traitre "}},{"citation":"Ma femme… mon ex-femme… C'était peut être un peu moins prestige parce qu'elle est pas reine… mais au moins, elle habitait pas à six heures de marche avec un autre mec.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"Le Vice de forme"}},{"citation":"Mais moi, j'm'en fous des honneurs, rien à péter, le Graal aussi, rien à péter. Moi, c'est Arthur qui compte. Moi je suis pas un as de la stratégie ou du tir à l'arc, mais je peux me vanter de savoir ce que c'est que d'aimer quelqu'un.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"L'Habitué"}},{"citation":"Ah ça y'est, j'viens de comprendre à quoi ça sert la canne. En fait ça sert à rien… Du coup ça nous renvoie à notre propre utilité : l'Homme face à l'Absurde !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"L'Inspiration"}},{"citation":"Moi, la canne, ça m'aide. Je visualise le caillou dans l'eau, j'ai l'impression de faire partie d'un tout, moi, le caillou, le fil, le lac, le ciel, c'est entier, vous comprenez ? C'est bien fini. C'est pour ça, moi je me dis, c'est dans ces moments-là qu'on peut bien comprendre des trucs. Vous me prenez pour un con, non ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"L'Inspiration"}},{"citation":"C'est pas moi qu'explique mal, c'est les autres qui sont cons !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Perceval Fait Raitournelle"}},{"citation":"Au printemps, j'aime bien pisser du haut des remparts au lever du soleil… Y'a une belle vue !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre IV","episode":"Tous les matins du monde, 2eme partie"}},{"citation":"Ben moi en général, je lui réponds \"merde\". En principe ça colle avec tout.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre IV","episode":"Tous les matins du monde II"}},{"citation":"J'bouff'rais un ch'val en salade !!! ","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"Tous les matins du monde (Première Partie)"}},{"citation":"Lorsqu'on le tient par la partie sporadique, ou boulière, le fenouil est un objet redondant.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"Unagi IV"}},{"citation":"Tout à l'heure, on a vu que le chapelet de saucisses n'était pas un objet redondant. Et pourtant, on a pu lui trouver une utilisation périmétrique en s'en servant comme un fouet.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre IV","episode":"Unagi IV"}},{"citation":"(à Perceval et Karadoc)  Vous vous entrainez à mettre le merdier ?!?","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre IV","episode":"Unagi IV "}},{"citation":"LANCELOT : La dame du lac ??!! \r\n                     MELEAGANT : (Ironique et frappant dans les mains) Héhéhé! On va passer... Une bonne soirée! MAGNIFIQUE!","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Aux yeux de tous III "}},{"citation":"Mais je pensais que vous auriez trouvé une petite clairière… avec un ruisseau. Les tocards prennent toujours leur retraite près d'un ruisseau, à cause de la soif. Pourtant une retraite, c'est une retraite de tout, ne croyez-vous pas ? Moi, quand j'ai plus rien à faire ici, je me retire… Plus une goutte d'eau. Plus un rayon de soleil. Je me dessèche, de la tête aux pieds, en un petit cadavre sous un tas de feuilles… Les saisons me survolent sans me soupçonner… Et puis, un jour, la corneille raconte qu'elle a entendu au loin quelqu'un qui recommence à pleurer. Guenièvre ! Guenièvre ! Alors là, j'ouvre un œil, je rampe, mangeant la neige, léchant l'eau croupie… et mes ennemis tressaillent, car à me voir boire, ils comprennent que je suis de retour. (Pause) Vous m'faites pas rentrer ? (Ricanement) Magnifique.","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Le Dernier Recours"}},{"citation":"Vous pouvez pas savoir comment on est trop jouasse d'être là !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les Nouveaux Clans"}},{"citation":"(À Merlin) Mais retournez à l'état sauvage, espèce de con. Foutez le camp dans les montagnes avec une paire de chèvres. On vous achètera vos fromages, promis. […] Vous le sentez pas, l'appel de la nature, là? Les animaux de la forêt, y z'ont pas besoin d'un toubib ? […] Tirez-vous d'ici. Définitivement. Et laissez bosser ceux qui savent faire ! Y a pas de place pour les amateurs ici.","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre V","episode":"La Sorcière"}},{"citation":"Ah non, avec les jolies seulement. C'est de là que j'ai conclu que, comme y m'touchait pas, je faisais moi-même partie des grosses mochetés.","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre V","episode":"Corvus corone"}},{"citation":"Non, c'est moi qui y suis pour quelque chose. Le coup d'État, c'est moi ! Le clan séparatiste, c'est moi ! Et d'une manière générale j'ai un lien plus ou moins direct avec tout ce qui se manigance de vicelard en Bretagne depuis ces trente dernières années, ça tout le monde le sait. Ce qu'on sait moins en revanche, c'est la raison qui me pousse à faire tout ça... [Arthur : Oui je vous écoute, qu'est ce qui vous pousse à faire tout ça?] L'amour ! Que je porte à ma femme, à votre sœur. [Arthur : Demi sœur!] Personne ne vous déteste plus qu'elle dans tout le royaume sire. Et moi, pauvre fou d'amour esclave de ses yeux, je ne cherche qu'à contenter ses désirs de vengeance. Me commanderait-elle de venir attaquer vos armées seul contre un million, je le ferai sans réfléchir. Alors quand cette salope a su que Lancelot organisait une armée séparatiste, elle m'a ordonné de m'associer à lui et de lui filer du pognon. Et moi, pauvre bête dressée, je me suis lâchement exécuté. Misa brevis et spiritus maxima. Ça veut rien dire, mais je suis très en colère contre moi même. ","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Corvus corone"}},{"citation":"Vous, vous êtes un peigne-cul en toutes circonstances. N'importe qui vous pousserait à n'importe quoi pourvu qu'il parle un peu fort","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Corvus corone"}},{"citation":"Vous vous étonnerez pas si vous ressentez une vive douleur sur le sommet du crâne. C'est sûrement que vous aurez pris le plat à gigot dans la tronche !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"Corvus corone"}},{"citation":"(En parlant d'Yvain et Gauvain)Ils ont la notion de rien. Même la notion de la menace que représente mon pied au cul ils l'ont pas. C'est désespérant.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le Périple"}},{"citation":"Gardez votre épée et servez-vous-en pour trouver le Graal ! [Arthur replante Excalibur]","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre V","episode":"La roche et le fer "}},{"citation":"Ah non, ce soir c'est beaucoup du clodo, mais c'est pas ceux là de votre équipe.","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chapuis","personnage":"Le Tavernier","saison":"Livre V","episode":"Les dauphins"}},{"citation":"Dans la vie, faut bosser pour personne, et y faut faire bosser personne ! C'est le secret de la liberté. […] Rien que d'imaginer que je retire l'épée du rocher et que je me retrouve à la tête de ce bordel, ça me fait de la spasmophilie !","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre V","episode":"Vae soli!"}},{"citation":"Ecoutez ma p'tite dame, ya des fois où y faut sentir le vent tourner et mettre du pognon a gauche pour filer a la concurrence [Mevanwi : où ça ? Chez Lancelot ?] [...] Pour aller là-bas, y faudrait que j'aie des principes, une quête à accomplir [Mevanwi : Et vous n'en avez pas ?] Si, m'en mettre plein les fouilles !","infos":{"auteur":"Alexandre Astier","acteur":"Bruno Fontaine","personnage":"Elias de Kelliwic'h","saison":"Livre V","episode":"Vae soli!"}},{"citation":"(Présentant sa nouvelle femme à Seli, Arthur et Leodagan)\r\nAh mais non... Mais vous vous êtes encore sur l'ancienne ! […]\r\nTout à fait, excusez-moi, j'ai pas percuté. Non non, l'autre elle est morte. Heu... Les articulations soutenaient plus son poids. Donc elle a commencé par se remplir d'eau par les coudes et après c'est passé aux chevilles, c'est remonté aux genoux et un matin, elle avait tellement gonflé que j'ai appelé la garde.\r\nAlors heu... Ils sont venus, ils lui ont mis un coup de lance et puis elle a essayé de se... de se faufiler comme ça, pour se cacher sous le buffet.\r\nPis elle passait pas parce que bon ben... Elle avait plus conscience de sa masse donc elle est restée là, comme ça, pis... Bah six heures après, elle était crevée.\r\nDonc, la Duchesse d'Aquitaine !","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chabat","personnage":"Le Duc d'Aquitaine","saison":"Livre V","episode":"Les Fruits d'Hiver"}},{"citation":"(En parlant de Dame Mevanwi) Ouais ouais ben j'suis pas trop. Sauf que quand on fait des choix il faut les tenir un minimum. Et ça change de chambre et ça change de mari... \r\n(Dame Mevanwi) Mais mêlez vous de vos fesses !\r\nOuais ouais ouais ! Il faudrait peut-être commencer par se comporter en adulte !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Les Exilés"}},{"citation":"Je voulais savoir pourquoi vous laissiez tous vos chevaliers former des clans séparatistes, alors que l'une de vos plus importantes missions a toujours été de fédérer les clans existants autour de votre royaume et de la quête du Graal ? ... Enfin c'était pas tout à fait ça...","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre V","episode":"Les Exilés"}},{"citation":"(Récitant d'un ton peu convaincant) «Si c'est ma tête qui vous revient pas, vous pouvez toujours aller roupiller dans le couloir. […] Et à partir de maintenant, si j'entends un mot plus haut que l'autre je vous… renvoie dans votre bled d'at… natal à coups de pied dans… dans le fion. Comme ça vous pourrez aller ratisser la bouse et torcher le cul des poules, ça vous fera prendre l'air.»","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chabat","personnage":"Le Duc d'Aquitaine","saison":"Livre V","episode":"Les Nocturnales"}},{"citation":"(A Galessin : \"Le rapport entre quoi et quoi ?\") Entre Excalibur et le fromage gratiné. Réponse: Aucun. C'est une métaphore moisie tiraillée entre votre stupidité d'ordre général et votre surprenante inaptitude à utiliser les métaphores...","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Aux yeux de tous III"}},{"citation":"VIVIANNE : Vous voulez vraiment pas me dire qui vous êtes? \r\n                     MELEAGANT : Non, mon nom ne vous dira rien... Mais chez vous on m'appelle... La réponse [...] La réponse à votre pathétique désastre! ","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Aux yeux de tous III"}},{"citation":"Vous entendez ça ? Il parait que je suis malpoli ! Qu'est-ce que vous en pensez bande de trous-du-cul ?","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Aux yeux de tous III"}},{"citation":"Vous me faites penser à ces types qui se servent jamais en premier pour faire poli, et quand c'est à eux...ils prennent tout le fromage gratiné et les autres, ils sont obligés de manger le légume seul.","infos":{"auteur":"Alexandre Astier","acteur":"Alexis Hénon","personnage":"Galessin","saison":"Livre V","episode":"Aux yeux de tous III"}},{"citation":"Oh l'Irlande !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Aux Yeux De Tous III"}},{"citation":"Eh... Il a pas inventé le plat de la main morte, celui-là.","infos":{"auteur":"Alexandre Astier","acteur":"Antoine de Caunes","personnage":"Dagonet","saison":"Livre V","episode":"La promesse"}},{"citation":"Non, mais on peut adapter. […] On peut dire, euh… \u003csmall>bon, je dis :\u003c/small> […] «Avec votre dégaine… euh… […] Avec votre dégaine de crevette, faites gaffe à pas vous faire bouffer par un mérou.»","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chabat","personnage":"Le Duc d'Aquitaine","saison":"Livre V","episode":"Le Forfait"}},{"citation":"\r\nAllez y! Défilez\r\nles petites fourmis. Mettez vous bien en rang.\r\nVenez mesurer votre risible destin à celui des Pendragon.\r\nVenez constater la navrante insignifiance de vos existences.\r\nVous avez pensé que les dieux allaient enfin reconnaitre en vous le souverain que personne n'avait vu?\r\nVous alliez enfin donner au monde le spectacle de votre avènement.\r\nQuel roi suis-je ? Un roi sévère ? un roi conquérant ?\r\nVous n'êtes rien. Rien ! Vous retournerez chez vous comme vous en êtes parti… Anonyme !\r\nPaisiblement, mon fils viendra reprendre ce qui est à lui. \r\nEt vous mettrez un genou en terre. Et vous baisserez les yeux.\r\nEt vous jurerez fidélité. Car c'est tout ce qu'il vous reste !","infos":{"auteur":"Lionnel Astier","acteur":"Josée Drevon","personnage":"Ygerne","saison":"Livre V","episode":"Le dernier jour"}},{"citation":"(À Loth)Alors, si vous êtes plus à l'aise avec les notions concrètes, je peux vous proposer mon pied dans les noix...","infos":{"auteur":"Lionnel Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le dernier jour"}},{"citation":"Tout cela n'est rien. Absolument rien ! Il y a peu de temps quelque chose a fait «Boum». Voila, nous sommes sur une toute petite miette expulsée par ce boum, qui dérive et tournicote sur elle-même, en attendant sa fin, proche ! Sur cette miette de tous petits organismes gesticulent ; ça nait, ça vit, ça meurt. Tout cela n'a aucune conséquence.","infos":{"auteur":"Lionnel Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Le dernier jour"}},{"citation":"(À Guenièvre) Votre petit train-train quotidien de reine de Bretagne. Quand je pense à toutes les pécores qui se couperaient les mains pour avoir le tiers de vos soucis, ma pauvre !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"Le Dernier Jour"}},{"citation":"(Encore à Guenièvre) Nous aussi, on vous aime. A partir du moment où vous gardez vos miches sur le trône et où vous foutez pas l'camp dès qu'un blondinet vous fait d'l'œil.","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"Le Dernier Jour"}},{"citation":"(Toujours à Guenièvre) Si vous préférez retourner dans votre cabane de trappeur avec votre dégénéré de Lancelot, libre à vous !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"Le Dernier Jour"}},{"citation":"(au père Blaise)Vous mériteriez que je vous foute à la lourde avec les chiens au calcif !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le Jurisconsulte"}},{"citation":"(Au Père Blaise)\r\nZ'êtes un glandeur. Un gros... GLANDEUR !!!","infos":{"auteur":"Alexandre Astier","acteur":"Christian Clavier","personnage":"Le Jurisconsulte","saison":"Livre V","episode":"Le Jurisconsulte"}},{"citation":"Mais vous êtes une grosse morue!","infos":{"auteur":"Alexandre Astier","acteur":"Christian Clavier","personnage":"Le Jurisconsulte","saison":"Livre V","episode":"Le Jurisconsulte"}},{"citation":"Peau de vache.","infos":{"auteur":"Alexandre Astier","acteur":"Christian Clavier","personnage":"Le Jurisconsulte","saison":"Livre V","episode":"Le Jurisconsulte"}},{"citation":"Quand y'a plus de roi, c'est caca.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Le Jurisconsulte"}},{"citation":"(Sur l'air de Promenons-nous dans les bois)\r\nY' vont faire des beignets !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Le Jurisconsulte"}},{"citation":"Jusqu'à présent, vous cumuliez trois statuts : bâtard, fils d'assassin et usurpateur. Bâtard, vous le serez toujours, de même que vous serez toujours le fils de votre sale ordure de père. Mais aujourd'hui, vous n'êtes plus roi, vous n'usurpez plus votre titre, c'est déjà ça.","infos":{"auteur":"Alexandre Astier","acteur":"Anouk Grinberg","personnage":"Anna","saison":"Livre V","episode":"La Supplique"}},{"citation":"Quand on veut être sûr de son coup, mon petit bonhomme, on plante des carottes, on ne joue pas les chefs d'État !","infos":{"auteur":"Alexandre Astier","acteur":"Anouk Grinberg","personnage":"Anna","saison":"Livre V","episode":"La Supplique"}},{"citation":"(S'adressant au roi Loth) Excusez-moi, est-ce qu'à un seul moment, j'aurais par mégarde donné le moindre signe de vouloir discuter avec vous?","infos":{"auteur":"Alexandre Astier","acteur":"Anouk Grinberg","personnage":"Anna","saison":"Livre V","episode":"La Supplique"}},{"citation":"Vous êtes une gigantesque tarlouze.","infos":{"auteur":"Alexandre Astier","acteur":"Anouk Grinberg","personnage":"Anna","saison":"Livre V","episode":"La Supplique"}},{"citation":"Ça suffit !!! Ça suffit !!! Ça suffiiiiiiiit !!!","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Domi Nostræ"}},{"citation":"Ça suffit ! Elle est où la poulette ? Elle est bien cachée ?","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Domi Nostræ"}},{"citation":"Le caca des canards c'est caca.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Domi Nostræ"}},{"citation":"Vous rendez la poulette ou c'est tout nus dans les orties !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Domi Nostræ"}},{"citation":"Vous rendez la poulette sinon c'est plus vous qui donnez à manger aux lapins !","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Domi Nostræ"}},{"citation":"Vous prenez votre arc et vous le bouffez ! Espèce de dégénéré sanguinaire !","infos":{"auteur":"Alexandre Astier","acteur":"Nicolas Gabion","personnage":"Bohort","saison":"Livre V","episode":"Les Embusqués"}},{"citation":"(Complètement ivre) I faut faire tenir un balai en équilibre sur le pif pour s'faire servir ici, ou quoi qu'ce soiye ? ","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre V","episode":"La nourrice"}},{"citation":"(Complètement ivre) Quand j'étais jeune, je pouvais faire rentrer un pigeon directement dans la bouteille sans la casser... C'est pas compliqué, vous prenez un pigeon, vous y faites sécher jusqu'à qu'ce soit presque friable. Après vous y mettez sur les... sur la branche de prunier, autour de la fleur... Comme ça la poire elle pousse directement à l'intérieur du pigeon séché, et avec le liquide... ça gon... ça gonfle heu... et ça fait r'prende une... heu... ça fait r'prende une forme de pigeon. (Il s'écroule.)","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre V","episode":"La nourrice"}},{"citation":"Môssieur Sire, en chair et en personne ! […] (À Guethenoc) J'étais v'nu pour vous emmerder, mais là ça m'coupe le sifflet !","infos":{"auteur":"Alexandre Astier","acteur":"Gilles Graveleau","personnage":"Roparzh","saison":"Livre V","episode":"La nourrice"}},{"citation":"Hé ! Hééé ! J'suis pas une spécialiste, mais, à mon avis, là, vous allez mourir, hein !","infos":{"auteur":"Alexandre Astier","acteur":"Audrey Fleurot","personnage":"La Dame du Lac","saison":"Livre V","episode":"La Nourrice"}},{"citation":"(ivre) C'est pour ça que j'ai jamais été rien réclamer à Kaamelott. Déjà, j'aime pas bien aller pleurnicher. Je bricole mes combines dans mon coin. Je préfère aller «escroquer», plutôt que d'embêter autrui. Vous voyez ? ","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chapuis","personnage":"Le Tavernier","saison":"Livre V","episode":"La Nourrice"}},{"citation":"Je vous préviens, la matinée a eu sa bonne dose de pignoufs, je suis plus que crevée... Alors je préconise un déjeuner dans le calme.","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"Les Fruits d'hiver"}},{"citation":"LANCELOT : Si vous tenez tant à la mort d'Arthur, vous n'avez qu'à vous en occuper vous-même. \r\n                     MELEAGANT : Je n'ai aucun intérêt à la mort des gens. \r\n                     LANCELOT : Mais alors, à quoi ? Bon sang, à quoi ? \r\n                     MELEAGANT : A leur sabordage. ","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Jizô"}},{"citation":"Camouflage caca...","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Unagi V"}},{"citation":"Il est où Kadoc ? Il est bien caché ?","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Unagi V"}},{"citation":"Par contre pas un mot là, sinon la porte. Bon là y en a pas, mais ce n'est pas la première fois qu'on fabrique une porte à la dernière minute pour virer un petit trou de balle qui fait son malin.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Unagi V"}},{"citation":"Progressif... N'oubliez pas, dans la casse, le plus important, c'est les suites d'épaisseurs ... Bûche de 10, Bûche de 16; Bûche de 32, Bûbûche, Bibuchette, et re-Bûche de 6 !!!","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Unagi V"}},{"citation":"Un arbre ça pousse, c'est là où vous pourrez faire la différence: le camouflage il pousse pas !","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre V","episode":"Unagi V"}},{"citation":"Ah bravo femme. Ce repas fut des plus roboratifs !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les pionniers"}},{"citation":"Allez femme, robore nous donc de quelques fruits bien sucrés. Il s'agit d'une régalade !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les pionniers"}},{"citation":"Femme, comme je le disais tantôt,tu nous a roboré. Mais sauras tu nous régaler d'un dessert de ton choix ?","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les pionniers"}},{"citation":"Ahhh, c'est pour ça que vous avez changé de siège, c'est parce que vous êtes pépé... Heu non, c'est parce que vous êtes roi.","infos":{"auteur":"Alexandre Astier","acteur":"Tony Saba","personnage":"Hervé de Rinel","saison":"Livre V","episode":"Les Pionniers"}},{"citation":"Ah non ! AH NON ! On ne se vautre pas dans la bouffe, c'est INTOLÉRABLE !!! Vous allez arrrrrrêter !!!","infos":{"auteur":"Alexandre Astier","acteur":"Christian Clavier","personnage":"Le Jurisconsulte","saison":"Livre V","episode":"Les Pionniers"}},{"citation":"Femme, cesse donc de nous esbaudir les oreilles ! Olala, il suffit !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les Pionniers"}},{"citation":"Femme ! Tu nous abaubis les oreilles ! Rabats un peu ta casquette !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les Pionniers"}},{"citation":"Mais c'est trop sur votre route quoi ! Bon y'a une colline, deux collines du coup bi-collines et après c'est carrément votre route !","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Les Pionniers"}},{"citation":"Ah mais vous êtes pas ma mère ! Si j'ai envie de mettre des grosses morues dans mon plumard, JE FAIS CE QUE JE VEUX !!! Soyez gentille, lâchez-moi la chemise !","infos":{"auteur":"Alexandre Astier","acteur":"Christian Clavier","personnage":"Le Jurisconsulte","saison":"Livre V","episode":"La Conspiratrice"}},{"citation":"BANDES DE TROUS DU CUL !!!","infos":{"auteur":"Alexandre Astier","acteur":"Christian Clavier","personnage":"Le Jurisconsulte","saison":"Livre V","episode":"La Conspiratrice"}},{"citation":"Caca.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Le Destitué"}},{"citation":"Il faut pas respirer la compote, ça fait tousser.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Le Destitué"}},{"citation":"Moi je viens un peu en tant que médiateur hein, et je confirme hein, c'est une très grosse morue dont vous devriez vous méfier !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Robert Lombard","personnage":"Père Blaise","saison":"Livre V","episode":"Le Destitué"}},{"citation":"(Parlant à ses compères du roi Arthur) Donc là, pour le voyageur isolé y'a deux solutions : soit il dépose ses armes, ses objets, sa bouffe et ses fringues par terre, et il s'en va d'où il est venu à poil dans la neige, soit il décide de se battre... À un contre dix.","infos":{"auteur":"Alexandre Astier","acteur":"Loïc Varraut","personnage":"Venec","saison":"Livre V","episode":"Le Destitué"}},{"citation":"Y'a plusieurs personnes qui sont passées par votre siège là, et beeen, le tout premier, je crois qu'il s'appelait... Carbure, ça fait vachement longtemps qu'on l'a pas vu. Moi, je serais vous, je lancerais des recherches.","infos":{"auteur":"Alexandre Astier","acteur":"Tony Saba","personnage":"Hervé de Rinel","saison":"Livre V","episode":"Le Destitué"}},{"citation":"Ça suffit, vous rendez la poulette, sinon papi va se mettre en colère.","infos":{"auteur":"Alexandre Astier","acteur":"Brice Fournier","personnage":"Kadoc","saison":"Livre V","episode":"Le Retour du Roi"}},{"citation":"Vous êtes des porcs !","infos":{"auteur":"Lionnel Astier","acteur":"Josée Drevon","personnage":"Ygerne","saison":"Livre V","episode":"Anton"}},{"citation":"Je crois que c'est rentré par là, et c'est ressorti par là ; et c'est re-rentré par là, et c'est RE-RE-SORTI PAR LA. ET NOUS ON S'SAIGNE AUX QUATRE FROMAGES !!!","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Domi Nostrae"}},{"citation":"Quand je pense à la chance que vous avez de faire partie d'un clan dirigé par des cerveaux du combat psychologique, qui se saignent...aux quatre parfums du matin au soir ! !","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre V","episode":"Domi Nostrae"}},{"citation":"Ah bah ouais mais là euh... Le voile noir, le chaos... J'ai passé un cap hein.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Hurlements"}},{"citation":"(À Ygerne et Cryda) C'est qu'elles nous accuseraient de conspiration, les siamoises !","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"Hurlements"}},{"citation":"C'est allé relativement vite, mais il a quand même fallu que je m'y reprenne à deux fois… J'l'avais pourtant étranglé pendant cinq bonnes minutes, le fumier, il était bleu outre-mer avec une jolie langue gonflée comme une escalope de dinde, et pourtant croyez-moi si vous voulez, il respirait encore la vieille carne. Et, je sais pas si c'est cette respiration paniquée et sifflotante, ou alors si c'est le fait qu'il me fixait avec de grands yeux rouges - parce que tous les vaisseaux avaient pété - mais je me suis senti un peu déstabilisé. Alors j'lui ai bourré la bouche avec un linge trempé dans de l'huile de lampe et j'ai foutu le feu. Bah ça répond à votre question du coup : oui, c'est allé assez vite.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Hurlements"}},{"citation":"Cette épée grotesque est le plus pitoyable tour de passe-passe que les dieux aient jamais bricolé pour arriver à leurs fins.","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Hurlements"}},{"citation":"Ouais, alors là où je vois que je suis vraiment à cran, c'est que quand vous avez dit malédiction, j'ai fait une série de tout petits pets comme ça : pft pft pft pft pft pft.","infos":{"auteur":"Alexandre Astier","acteur":"Simon Astier","personnage":"Yvain","saison":"Livre V","episode":"Hurlements"}},{"citation":"(À Anna) j'aime autant vous dire que quand une bande de détrousseurs embusqués nous tombera sur la viande, et qu'il lui prendra le goût de vous passer dessus en file indienne, je lèverai pas le petit doigt.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Jizo"}},{"citation":"(À Arthur) Avant de vous lancer dans les excès de virilité, vous auriez la curiosité de jeter un œil à la table du fond. Je suis venu avec quelqu'un qui veut vous parler... [Tavernier : Qu'est ce qu'on fait la?] Rien, y faut surtout pas s'en mêler. Comme quand deux chats sauvages se retrouvent sur le même terrain. Y s'observent et aucun des deux ne baisse le regard sous peine d'être saigné à blanc. Ce qui couperait court c'est qu'il y en ait un plus faible que l'autre, mais là c'est pas le cas. C'est les deux même sales bestioles, inflexibles, indomptables et vivaces. Y tiennent ça de leur mère! [Tavernier : De leur mère? vous voulez dire que c'est sa sœur ?][Arthur et Anna : Demi sœur!] Ah! ça cause. Le dialogue s'amorce. Peut être que vous vous ferez pas dévaster votre boui-boui.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Jizo"}},{"citation":"Oui mais, quand je reste trop dans ma baraque, je conspire, c'est un réflexe. Du coup, je prends l'air, ça vaut mieux pour tout le monde.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"La Promesse"}},{"citation":"Si on avait bu un coup dans des trucs qui s'cassent, j'en aurais pété un par terre avant d'monter dans ma chambre, pour bien montrer comment j'suis colère.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"La Promesse"}},{"citation":"Je vous le dis, cette histoire ça pue !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"La roche et le fer"}},{"citation":"(À Yvain et à Guenièvre) Si les dieux avaient dû être de notre côté, ils nous auraient pas refilé des enfants comme vous. ","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"La Roche et le Fer"}},{"citation":"J'suis roi de Bretagne, j'ai pas de conseil à recevoir d'une clodo !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"La Roche et le Fer"}},{"citation":"[Perceval: Si vous foutez tout en l'air, on vous envoie notre assassin, ça va pas traîner.]\u003c/br>\r\nOuais. Ou alors le mec qu'on dirait qu'il marche normalement mais en fait il marche alternativement à cloche-pied sur chaque pied.","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre V","episode":"La Roche Et Le Fer"}},{"citation":"Prenons un symbole connu : le Graal. Tout le monde sait bien que c'est beaucoup plus qu'un vase, hein ? Y'a toute une signification autour. Mais regardez ça par exemple : c'est une couronne. Alors d'un point de vue purement concret, ça veut juste dire que je suis Roi. mais d'un point de vue symbolique c'est beaucoup plus intéressant... Par exemple, cette couronne nous informe symboliquement que tous les mous du slibard qui avaient l'habitude de se les rouler sous l'ancien régime vont devoir se mettre un coup de fouet s'ils veulent pas que je leur mette moi-même. Cette couronne symbolise la fin des haricots et la décarrade des tire-au-flanc, et surtout l'avènement de l'ordre et de la discipline. En d'autres termes, la rigolade, c'est terminé.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"L'avènement du Sanguinaire"}},{"citation":"Les chiffres, c'est pas une science exacte figurez-vous!","infos":{"auteur":"Alexandre Astier","acteur":"Jean-Christophe Hembert","personnage":"Karadoc","saison":"Livre V","episode":"Le dernier recours"}},{"citation":"(À Anton) Je parle moins maintenant, je terrasse plus mes ennemis par l'éloquence. Plus je vieillis plus je ferme ma gueule. Aujourd'hui ce qu'il me faudrait c'est le médaillon Harpocrate avec le doigt sur la bouche comme ça. Je suis désolé de jamais être revenu vous voir.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"Le garçon qui criait au loup"}},{"citation":"Mais c'est de ma faute, à moi, si vous semez des pères adoptifs dans tout le pays ?","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Le Garçon Qui Criait Au Loup"}},{"citation":"Je suis désolé, mais les dieux ont pas l'air de votre avis. Je crois qu'ils en ont marre de ma tronche.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"L'Élu"}},{"citation":"(À Mevanwi) Elle a compris la vilaine frisée ? On a dans l'projet de fonder un clan autonome pour partir à l'aventure et ramener du pognon pour entretenir vos grosses miches !! Alors le cageot il dit merci et il ferme sa boîte à caca !!!","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"L'épée des rois"}},{"citation":"(À Ygerne et Cryda) C'est des tartes dans le museau qu'elles cherchent, les sœurs Tape-Dur ?","infos":{"auteur":"Alexandre Astier","acteur":"Joëlle Sevilla","personnage":"Séli","saison":"Livre V","episode":"L'épée des rois"}},{"citation":"La seule solution pour que ce soit encore plus sale, ça serait de demander aux clients de chier directement par terre ! Je vois que ça.","infos":{"auteur":"Alexandre Astier","acteur":"Alain Chapuis","personnage":"Le Tavernier","saison":"Livre V","episode":"L'épée Des Rois"}},{"citation":"On va pas installer notre carré germinal à la taverne !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"L'épée Des Rois"}},{"citation":"Faire tourner cette baraque… et guider tous ces débiles jusqu'au Graal, c'est sur moi que c'est tombé. Les dieux ont trouvé une bonne pomme pour s'arracher les cheveux avec cette histoire de dingues, ils sont pas près de la lâcher.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"L'Épée des rois "}},{"citation":"Pour le Graal, j'ai bâti une forteresse, moi. Kaamelott, ça s'appelle. J'ai été chercher des chevaliers dans tout le royaume. En Calédonie, en Carmélide, à Gaunes, à Vannes, aux Pays de Galles. J'ai fait construire une grande table, pour que les chevaliers s'assoient ensemble. Je l'ai voulue ronde, pour qu'aucun d'entre eux  ne se retrouve assis dans un angle, ou en bout de table. C'était compliqué, alors j'ai essayé d'expliquer ce qu'était le Graal, pour que tout le monde comprenne. C'était difficile, alors j'ai essayé de rigoler pour que personne ne s'ennuie. J'ai raté, mais je veux pas qu'on dise que j'ai rien foutu, parce que c'est pas vrai.","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"Le retour du Roi"}},{"citation":"(À Séli)Vous voulez que j'aille lui mettre une avoine ? ","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le royaume sans tête"}},{"citation":"Dites, vous savez qu'à solliciter trop souvent la patience des gens, on finit par agacer ? ","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le royaume sans tête"}},{"citation":"Et qu'est-ce que vous voulez que j'y fasse à la paperasse, moi ? Vous me prenez pour un serre-livre ?","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le royaume sans tête"}},{"citation":"Non, mais je crois que mes ambitions se résument clairement: la férocité avant tout.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le royaume sans tête"}},{"citation":"Parce qu'au bout d'un moment, il va falloir envisager la possibilité de me lâcher la collerette ! ","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Le royaume sans tête"}},{"citation":"On a une autorité naturelle, il faut en profiter... J'suis sûr que même à poil on ferait toujours chef !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Le Royaume Sans Tête"}},{"citation":"[À Galessin] Mais parce que votre existence est merdique mon pauvre ami, vous avez l'œil qui brille à chaque fois qu'un oiseau pète, c'est triste à voir. Ça fait des années que vous menez un train de vie de noix de St-Jacques, alors évidemment, un message qui annonce la visite d'un imbécile porteur de bonnes nouvelles, c'est déjà un petit festival pour vous ! J'suis sûr que vous vous êtes peigné pour l'occasion !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"Euh, \"Vous êtes là.\", c'est-à-dire qu'il est surpris lui-même, ça lui viendrait pas à l'idée de raccorder le fait qu'on est là avec le fait qu'il nous l'a demandé.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"J'ai soudain la sensation limpide d'avoir gaspillé ma jeunesse... L'avoir vue s'échapper de mes mains comme l'anguille effrayée et m'appeler à présent sur le lierre du tombeau, où patiente depuis toujours le chant des enfants, les raisins volés…","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"Je vais y aller, de jour, devant tout le monde. Et si je deviens roi de Bretagne, je vous nomme respectivement ministre des armes, et responsable de la protection des frontières. Parce que mon destin, c'est de m'entourer de nuls, de vrais nuls… Timeo libri rex agitur, ça veut rien dire, mais c'est ce que j'ai trouvé de plus… aigre !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"Moi, après deux heures de retard, j'ai passé le cap de l'agacement. Le peu de volonté que j'avais de me farcir une réunion avec ce débile de Dagonet a définitivement disparu. Je suis une sorte de meuble.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"Moi c'est comme vous sentez, j'ai eu deux heures à vide, c'est pas si souvent, je pense que j'en ai inconsciemment profité pour dresser un petit bilan.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"Votre femme, si j'avais pas la flemme de descendre de là, elle aurait pris mon pied dans son cul depuis un moment. Parce y'a un truc qu'on oublie quand on parle de retirer Excalibur : c'est le respect au Roi Arthur! Et le respect au Roi Arthur je remarque que Madame en avait un peu plus quand elle était dans son PLUMARD !!","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Les Dauphins"}},{"citation":"Et si je sens que y a des anguilles à la broche, dehors ! Comme César quand il a chassé les marchands du temple, et qu'ils ont foutu le camp sur le bateau avec les bestioles et l'pépé.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Les recruteurs"}},{"citation":"Je vais vous poser une série de questions. Vous répondez par oui, non, ou Zbradaraldjan. Ok c'est parti : où se trouve l'oiseau ?... Allez c'est facile ça. Trouve pas ? Bon tant pis. C'était \"sur la branche\". Eh oui, y a des pièges.","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Les recruteurs"}},{"citation":"Ma tante me demande de trouver un endroit pour y entreposer 667 noix. A la cave il y a de la place pour 595, à la remise il y a la place pour 337. Qu'est-ce que je fais ? Je les ?... Allez on cherche bon dieu ! Je les... Zbradaraldjan le grenier!... Allez il dégage le bourrin !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Les recruteurs"}},{"citation":"Si la mémoire est à la tête ce que le passé, peut-on y accéder à six ? Oui, non, zbradaraldjan ?","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Les recruteurs"}},{"citation":"(À Venec) C'est un style que vous vous donnez d'être à moitié cul nu ? [...] Remarquez ça change. Et puis ça désacralise le guet-apens.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Repentants"}},{"citation":"Les petits pères, les affaires reprennent. Parce que la couronne, là, j'aime autant vous dire qu'elle date pas d'hier. Là, y a de la relique ou je m'appelle pas Venec. […] Qu'est-ce vous en dites ? Bon, hein, imaginez que j'ai mon froc, ça me donne du style ou pas ?","infos":{"auteur":"Alexandre Astier","acteur":"Loïc Varraut","personnage":"Venec","saison":"Livre V","episode":"Les Repentants"}},{"citation":"Quand on veut être sûr de son coup, Seigneur Dagonet… on plante des navets. On ne pratique pas le putsch.","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Les Repentants"}},{"citation":"(À Élias de Kelliwic'h )Eh ben, vous avez une de ces tronches, vous ! [Élias : Quoi ? Quelle tête ?] J'en sais rien mais plus que d'habitude, hein ! Vous avez toujours une mine de chiotte mais là... j'sais pas si c'est la lumière du feu ou quoi mais on dirait que vous êtes mort.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Les Rivales"}},{"citation":"(À propos des moutons) Mais je n'comprends pas, c'est pas des moutons ça ? […] Bah ils sont tout... tout bizarres... […] Tondus ? Oh mon Dieu mais quelle horreur ! Mais pourquoi vous avez fait ça ?!","infos":{"auteur":"Alexandre Astier","acteur":"Anne Girouard","personnage":"Guenièvre","saison":"Livre V","episode":"Les Transhumants"}},{"citation":"Mais enfin, ça fait 15 lieues que vous nous pétez les noyaux avec vos bestioles : les moutons, les chèvres, les poules, vous croyez que ça nous intéresse ça ? (...) Oh la la, mais c'est pas vrai, les poules euh… c'est plus ce que c'était, les chèvres c'est pas rentable, maintenant les moutons c'est fastidieux ! Vous savez même pas ce que ça veut dire «fastidieux» !","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"Les Transhumants"}},{"citation":"Vous pouvez rentrer à Kaamelott. Vous regarderez les gens. Vous regarderez les choses. Rien ne sera plus triste que vous.","infos":{"auteur":"Alexandre Astier","acteur":"Carlo Brandt","personnage":"Méléagant","saison":"Livre V","episode":"Le Théâtre Fantôme"}},{"citation":"Ce qu'il y a de bien avec les opinions tranchées, c'est qu'ça relance le débat. En somme vous êtes une sorte de provocateur, quoi.","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre V","episode":"Perceval de Sinope"}},{"citation":"Vous, vous avez une idée derrière la main, j'en mettrais ma tête au feu !","infos":{"auteur":"Alexandre Astier","acteur":"Franck Pitiot","personnage":"Perceval","saison":"Livre V","episode":"Perceval de Sinope"}},{"citation":"ARRÊTEZ DE M'APPELER SIRE !!!!!","infos":{"auteur":"Alexandre Astier","acteur":"Alexandre Astier","personnage":"Arthur","saison":"Livre V","episode":"Plusieurs épisodes de la saison V "}},{"citation":"Ah, mais c'est pas possible, ça ! J'ai pas envie, de participer ! À rien ! C'est pas mon genre, de participer ! Jamais je participerai ! À part à vos obsèques, bande de cons !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Vae Soli !"}},{"citation":"Mais ils sont tous plus débiles les uns que les autres ces pigeons. Les nôtres quand on les envoie à Kaamelott on se les fait systématiquement ramener par la vielle de la ferme d'à coté ![...] ça s'adresse à personne, les pigeons sont cons, point !","infos":{"auteur":"Alexandre Astier","acteur":"François Rollin","personnage":"Loth","saison":"Livre V","episode":"Vae Soli !"}},{"citation":"Ah mais ouais... Ah mais bien sûr, les gars... évidemment... nan mais allez-y, c'est mon truc les bateaux moi, je connais à mort... Allez-y hein... J'balance un caillou dans la flotte, y'en à trente qui r'montent.","infos":{"auteur":"Alexandre Astier","acteur":"Manu Payet","personnage":"Vérinus","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"Allons, je suis humilié. Moi qui croyais que le Romain respectait ses ennemis, et ben non ! En voilà encore une belle désillusion. S'ils croient que c'est avec une mentalité pareille qu'ils vont fédérer le pays, on leur rend leur fric, on remonte sur les chevaux, et on leur met sur la gueule ! D'un autre côté, restituer une pareille quantité de blé, ça frise le mauvais gout, je suis désolé, ça ne se fait pas ! Ne serait-ce par respect pour les plus nécessiteux. Bon allons, après, il y a le serment : si je garde le blé, j'attaque pas ! Et ben voilà : je garde le blé, j'attaque pas; un serment c'est sacré. Oui mais ce qui m'ennuie, c'est que c'est pile le jour que j'avais choisi pour vous passer le pouvoir, c'est quelque chose, les dates, hein ! Je garde le blé, j'attaque pas, je suis sous serment. Mais vous, maintenant que vous êtes roi de Carmélide, si... s'il vous prend le goût d'aller leur dérouiller le cul, je ne vois vraiment pas comment je pourrais vous en empêcher !","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"Ça s'enferme les registres ! (Glaucia : Ah bon ? ) Ouais ! Et les trous du cul qui font pas leur boulot, ça s'enferme aussi !","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"Eh les gars, vous savez ce qu'on bouffe ce soir ? DU ROMAIN !","infos":{"auteur":"Alexandre Astier","acteur":"Lionnel Astier","personnage":"Léodagan","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"(Glaucia : - Ave Publius Servius Capito, t'avais demandé un rendez-vous ?) Non. J'ai pas envoyé de fleurs non plus.","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"Une nuit, une nuit à attendre... Une longue nuit avant de savoir si le souverain ennemi acceptera un traité de paix, si fragile, si friable qu'on aurait même de la peine à le prendre au sérieux. Des solutions précaires, du rafistolage, voilà tout ce que j'ai su inventer. La Bretagne résistait quand je suis arrivé, elle résistera encore quand je partirai. Je ne saurais dire pourquoi, je conserve encore, rescapée de mon découragement, une curiosité : existe t-il quelqu'un parmi nous déjà - ou encore à naitre - qui se destine à restaurer l'ordre sur l'île de Bretagne? Et s'il existe, que peut-il bien posséder que je ne possède moi-même ? D'où vient-il? Est-il romain? Quelle arme tient-il à sa ceinture ? Celui qui vaincra là où j'ai échoué, je voudrais voir son visage une fois, car je lui conserve encore, rescapé de mon découragement, ma curiosité.","infos":{"auteur":"Alexandre Astier","acteur":"Tcheky Karyo","personnage":"Manius Macrinus Firmus","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"(Un sénateur : - J'vais vous dire : le jour où j'ai accepté d'être sénateur, j'aurais mieux fait de m'péter une jambe.) Ça peut encore s'arranger.","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Miles Ignotus"}},{"citation":"Regarde, vois ! Cette glorieuse cité cosmopolite, regarde.  Carrefour des civilisations, hôtesse orgueilleuse de peuplades fascinées, regarde. On nous reproche assez qu'il n'existe plus de vrais Romains, hein ? Hein ? Allez trouve un Breton, trouve. ","infos":{"auteur":"Alexandre Astier","acteur":"Patrick Chesnais","personnage":"Lucius Sillius Sallustius","saison":"Livre VI","episode":"Miles Ingnotus"}},{"citation":"Allez ! Et si on part assez tôt, on pourra peut-être s'arrêter deux minutes si on tombe sur des champis !.","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Centurio"}},{"citation":"Alors c'est ça, la stratégie moderne? Réunir cinq trous-de-balle en cercle et s'balancer des fions?","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Centurio"}},{"citation":"Et ben vous inviterez vos copains à la maison, on vous organisera une petite après-midi à la plage et vous pourrez faire des pâtés !.","infos":{"auteur":"Alexandre Astier","acteur":"Philippe Nahon","personnage":"Goustan","saison":"Livre VI","episode":"Centurio"}},{"citation":"(S'adressant à Merlin) Vous préférez monter dans la barque, maintenant, de plein gré, ou dans vingt secondes avec un coup de pompe dans l'oignon ?","infos":{"auteur":"Alexandre Astier","acteur":"François Levantal","personnage":"Capito","saison":"Livre VI","episode":"Centurio"}},{"citation":"Quand je dis que Rome est à la Cité ce que la chèvre est au fromage de chèvre, je veux dire que c'est le petit plus qui est corollaire au noyau mais qui est pas directement dans le cœur du fruit !","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre VI","episode":"Præceptores"}},{"citation":"Quand vous êtes parti, je me suis dit : Je vais me promener ? Je vais me pas promener ? Finalement j'ai décidé de me beurrer la gueule.","infos":{"auteur":"Alexandre Astier","acteur":"Jacques Chambon","personnage":"Merlin","saison":"Livre VI","episode":"Præceptores"}},{"citation":"(Capito : Les quatre en une seule fois, vous avez pas peur que ça soit un peu voyant non ?) Rien à foutre ! Tu peux même les crucifier sur une estrade au milieu du forum si ça te chante, c'est moi qui paye l'orchestre. ","infos":{"auteur":"Alexandre Astier","acteur":"Patrick Chesnais","personnage":"Lucius Sillius Sallustius","saison":"Livre VI","episode":"Arturi inquisitio"}},{"citation":"Ca y est ! C'est leur dernière saison aux débiles. Tu peux préparer les outils, on passe directement de la discussion à la désintégration.","infos":{"auteur":"Alexandre Astier","acteur":"Patrick Chesnais","personnage":"Lucius Sillius Sallustius","saison":"Livre VI","episode":"Arturi inquisitio"}},{"citation":"A l'époque, quand je levais le doigt, y avait 15 000 soldats qui gueulaient Imperator ! Maintenant, quand je lève le doigt, c'est pour aller pisser... ","infos":{"auteur":"Alexandre Astier","acteur":"Pierre Mondy","personnage":"César","saison":"Livre VI","episode":"Arturi Inquisitio"}},{"citation":"Imperator
